/* ═══════════════════════════════════════════════════════════════
   SIGNAL DECAY LORE ORACLE
   Dark glass + purple/indigo glow — mystic/oracle aesthetic
   ═══════════════════════════════════════════════════════════════ */

:root {
  --bg-primary: #06060f;
  --bg-secondary: #0c0c1a;
  --bg-tertiary: #12122a;
  --bg-card: rgba(15, 12, 35, 0.85);
  --bg-glass: rgba(20, 15, 50, 0.75);
  --border-subtle: rgba(139, 92, 246, 0.1);
  --border-medium: rgba(139, 92, 246, 0.2);
  --border-glow: rgba(139, 92, 246, 0.4);
  --text-primary: #e8e4f0;
  --text-secondary: #a89cc8;
  --text-muted: #6b5f8a;
  --purple: #8b5cf6;
  --purple-dim: rgba(139, 92, 246, 0.12);
  --purple-glow: rgba(139, 92, 246, 0.35);
  --indigo: #6366f1;
  --indigo-dim: rgba(99, 102, 241, 0.12);
  --violet: #a78bfa;
  --amber: #f59e0b;
  --cyan: #06b6d4;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Georgia', 'Times New Roman', serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ═══ BACKGROUND EFFECTS ═══ */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 20% 90%, rgba(79, 70, 229, 0.04) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

/* ═══ APP LAYOUT ═══ */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

/* ═══ HEADER ═══ */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(6, 6, 15, 0.9);
  backdrop-filter: blur(20px);
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.oracle-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(167, 139, 250, 0.6), rgba(99, 102, 241, 0.3), rgba(15, 12, 35, 0.9));
  border: 1.5px solid var(--border-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.3), inset 0 0 10px rgba(167, 139, 250, 0.2);
  animation: pulse-glow 3s ease-in-out infinite;
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3), inset 0 0 10px rgba(167, 139, 250, 0.2); }
  50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), inset 0 0 15px rgba(167, 139, 250, 0.3); }
}

.oracle-icon i { color: var(--violet); font-size: 18px; }

.header-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
.header-title h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}
.header-title span {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.header-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border-subtle);
  background: var(--bg-glass);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.header-btn:hover {
  border-color: var(--border-glow);
  color: var(--violet);
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
}

/* ═══ CHAT AREA ═══ */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 4px; }

/* Welcome state */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  gap: 24px;
  flex: 1;
}

.welcome-orb {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(167, 139, 250, 0.5), rgba(99, 102, 241, 0.2), rgba(15, 12, 35, 0.95));
  border: 2px solid var(--border-glow);
  box-shadow: 
    0 0 40px rgba(139, 92, 246, 0.3),
    0 0 80px rgba(99, 102, 241, 0.15),
    inset 0 0 30px rgba(167, 139, 250, 0.2);
  animation: orb-breathe 4s ease-in-out infinite;
  position: relative;
}

.welcome-orb::after {
  content: '👁';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  filter: hue-rotate(260deg) brightness(0.9);
}

@keyframes orb-breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(139, 92, 246, 0.3), 0 0 80px rgba(99, 102, 241, 0.15); }
  50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(139, 92, 246, 0.4), 0 0 100px rgba(99, 102, 241, 0.2); }
}

.welcome h2 {
  font-size: 22px;
  font-weight: 400;
  color: var(--violet);
  letter-spacing: 1px;
}
.welcome p {
  font-size: 14px;
  color: var(--text-secondary);
  max-width: 400px;
  line-height: 1.6;
}

/* Quick questions */
.quick-questions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 600px;
}

.quick-btn {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid var(--border-medium);
  background: var(--bg-glass);
  color: var(--text-secondary);
  font-size: 12px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  backdrop-filter: blur(10px);
}
.quick-btn:hover {
  border-color: var(--purple);
  color: var(--violet);
  background: var(--purple-dim);
  box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
  transform: translateY(-1px);
}

/* Messages */
.message {
  display: flex;
  gap: 12px;
  max-width: 85%;
  animation: fadeIn 0.3s ease;
}
.message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.message.oracle .msg-avatar {
  background: radial-gradient(circle at 30% 30%, rgba(167, 139, 250, 0.5), rgba(15, 12, 35, 0.9));
  border: 1px solid var(--border-glow);
  box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
}
.message.user .msg-avatar {
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.msg-content {
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  line-height: 1.7;
  font-size: 14px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

.message.oracle .msg-content {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-top-left-radius: 4px;
}
.message.user .msg-content {
  background: rgba(139, 92, 246, 0.12);
  border: 1px solid rgba(139, 92, 246, 0.2);
  border-top-right-radius: 4px;
  color: var(--text-primary);
}

/* Source tags */
.msg-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
}

.source-tag {
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--indigo-dim);
  border: 1px solid rgba(99, 102, 241, 0.2);
  font-size: 10px;
  color: var(--violet);
  font-family: 'SF Mono', 'Fira Code', monospace;
  letter-spacing: 0.3px;
}

/* Save button */
.msg-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.save-btn {
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid var(--border-subtle);
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  transition: all 0.2s;
}
.save-btn:hover {
  border-color: var(--amber);
  color: var(--amber);
}
.save-btn.saved {
  border-color: var(--amber);
  color: var(--amber);
  background: rgba(245, 158, 11, 0.1);
}

/* Typing indicator */
.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 8px 0;
}
.typing-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--purple);
  animation: typingBounce 1.4s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Typewriter effect */
.typewriter {
  overflow: hidden;
}

/* ═══ INPUT AREA ═══ */
.input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--border-subtle);
  background: rgba(6, 6, 15, 0.95);
  backdrop-filter: blur(20px);
  flex-shrink: 0;
}

.input-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-glass);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-xl);
  padding: 4px 6px 4px 18px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-wrapper:focus-within {
  border-color: var(--purple);
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
}

.input-wrapper input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 14px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  padding: 10px 0;
}
.input-wrapper input::placeholder {
  color: var(--text-muted);
}

.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--purple), var(--indigo));
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.send-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
}
.send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

/* ═══ CROSS-LINKS NAV ═══ */
.cross-links {
  display: flex;
  gap: 6px;
  padding: 10px 20px;
  background: rgba(6, 6, 15, 0.95);
  border-top: 1px solid var(--border-subtle);
  overflow-x: auto;
  flex-shrink: 0;
}
.cross-links::-webkit-scrollbar { display: none; }

.cross-link {
  padding: 6px 12px;
  border-radius: 14px;
  border: 1px solid var(--border-subtle);
  background: var(--bg-glass);
  color: var(--text-muted);
  font-size: 11px;
  white-space: nowrap;
  text-decoration: none;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  transition: all 0.2s;
}
.cross-link:hover {
  border-color: var(--border-medium);
  color: var(--text-secondary);
}
.cross-link.active {
  border-color: var(--purple);
  color: var(--violet);
  background: var(--purple-dim);
}

/* ═══ FAVORITES PANEL ═══ */
.favorites-panel {
  position: fixed;
  top: 0; right: -360px; bottom: 0;
  width: 350px;
  max-width: 90vw;
  background: rgba(10, 8, 25, 0.97);

  border-radius: 50%;
  border: 1px solid var(--border-subtle);
  background: transparent;
  color: var(--text-secondary);

  display: flex;
  align-items: center;
  justify-content: center;
}

.favorites-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.fav-item {
  padding: 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  margin-bottom: 8px;
  background: var(--bg-glass);
}
.fav-item-q {
  font-size: 12px;
  color: var(--amber);
  margin-bottom: 6px;
  font-weight: 600;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
.fav-item-a {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

}
.fav-item-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}
.fav-delete {
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid rgba(239, 68, 68, 0.3);
  background: transparent;
  color: #ef4444;
  font-size: 10px;
  cursor: pointer;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

.favorites-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 13px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

/* Overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.overlay.show { opacity: 1; pointer-events: all; }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 600px) {

  .header { padding: 12px 16px; }
  .chat-area { padding: 16px; }
  .input-area { padding: 12px 16px; }
}
</style>

// ═══ CONVERSATION STATE ═══
let conversationHistory = [];
let favorites = JSON.parse(localStorage.getItem('sd_oracle_favorites') || '[]');
let isStreaming = false;

// ═══ DOM ELEMENTS ═══
const chatArea = document.getElementById('chatArea');
const welcomeState = document.getElementById('welcomeState');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const favoritesBtn = document.getElementById('favoritesBtn');
const favoritesPanel = document.getElementById('favoritesPanel');
const favoritesList = document.getElementById('favoritesList');
const favoritesClose = document.getElementById('favoritesClose');
const overlay = document.getElementById('overlay');
const clearBtn = document.getElementById('clearBtn');

// ═══ EVENT LISTENERS ═══
userInput.addEventListener('input', () => {
  sendBtn.disabled = !userInput.value.trim() || isStreaming;
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && userInput.value.trim() && !isStreaming) {
    sendMessage();
  }
});

sendBtn.addEventListener('click', () => {
  if (userInput.value.trim() && !isStreaming) sendMessage();
});

favoritesBtn.addEventListener('click', () => {
  favoritesPanel.classList.add('open');
  overlay.classList.add('show');
  renderFavorites();
});

favoritesClose.addEventListener('click', closeFavorites);
overlay.addEventListener('click', closeFavorites);

clearBtn.addEventListener('click', () => {
  conversationHistory = [];
  chatArea.innerHTML = '';
  chatArea.appendChild(welcomeState);
  welcomeState.style.display = 'flex';
});

// ═══ FUNCTIONS ═══
function askQuestion(question) {
  userInput.value = question;
  sendMessage();
}

function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isStreaming) return;

  // Hide welcome
  welcomeState.style.display = 'none';

  // Add user message
  appendMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  userInput.value = '';
  sendBtn.disabled = true;

  // Get AI response
  getOracleResponse();
}

function appendMessage(type, content, sources = []) {
  const msgEl = document.createElement('div');
  msgEl.className = `message ${type === 'user' ? 'user' : 'oracle'}`;

  const avatar = type === 'user' ? '✦' : '👁';
  
  let sourcesHTML = '';
  if (sources.length > 0) {
    sourcesHTML = `<div class="msg-sources">${sources.map(s => `<span class="source-tag">📄 ${s}</span>`).join('')}</div>`;
  }

  let actionsHTML = '';
  if (type !== 'user') {
    actionsHTML = `<div class="msg-actions"><button class="save-btn" onclick="toggleFavorite(this)"><i class="fas fa-bookmark"></i> Save</button></div>`;
  }

  msgEl.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-body">
      <div class="msg-content">${formatContent(content)}</div>
      ${sourcesHTML}
      ${actionsHTML}
    </div>
  `;

  chatArea.appendChild(msgEl);
  chatArea.scrollTop = chatArea.scrollHeight;
  return msgEl;
}

function appendTypingIndicator() {
  const msgEl = document.createElement('div');
  msgEl.className = 'message oracle';
  msgEl.id = 'typingMsg';
  msgEl.innerHTML = `
    <div class="msg-avatar">👁</div>
    <div class="msg-body">
      <div class="msg-content">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>
    </div>
  `;
  chatArea.appendChild(msgEl);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typingMsg');
  if (el) el.remove();
}

async function getOracleResponse() {
  isStreaming = true;
  appendTypingIndicator();

  const messages = [
    { role: 'system', content: SYSTEM_PROMPT },
    ...conversationHistory
  ];

  try {
    const response = await fetch(AZURE_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'api-key': API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: messages,
        temperature: 0.7,
        max_tokens: 1500,
        stream: true
      })
    });

    if (!response.ok) {
      throw new Error(`API Error: ${response.status}`);
    }

    removeTypingIndicator();

    // Create message element for streaming
    const msgEl = document.createElement('div');
    msgEl.className = 'message oracle';
    msgEl.innerHTML = `
      <div class="msg-avatar">👁</div>
      <div class="msg-body">
        <div class="msg-content typewriter"></div>
      </div>
    `;
    chatArea.appendChild(msgEl);

    const contentEl = msgEl.querySelector('.msg-content');
    let fullContent = '';

    // Stream the response
    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');

      for (const line of lines) {
        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
          try {
            const data = JSON.parse(line.slice(6));
            const delta = data.choices?.[0]?.delta?.content;
            if (delta) {
              fullContent += delta;
              contentEl.innerHTML = formatContent(fullContent);
              chatArea.scrollTop = chatArea.scrollHeight;
            }
          } catch (e) { /* skip parse errors */ }
        }
      }
    }

    // Extract sources from content
    const sources = extractSources(fullContent);
    
    // Add sources and save button
    if (sources.length > 0) {
      const sourcesDiv = document.createElement('div');
      sourcesDiv.className = 'msg-sources';
      sourcesDiv.innerHTML = sources.map(s => `<span class="source-tag">📄 ${s}</span>`).join('');
      msgEl.querySelector('.msg-body').appendChild(sourcesDiv);
    }

    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'msg-actions';
    actionsDiv.innerHTML = `<button class="save-btn" onclick="toggleFavorite(this)"><i class="fas fa-bookmark"></i> Save</button>`;
    msgEl.querySelector('.msg-body').appendChild(actionsDiv);

    // Add to conversation history
    conversationHistory.push({ role: 'assistant', content: fullContent });

  } catch (error) {
    removeTypingIndicator();
    appendMessage('oracle', `*The Oracle's connection flickers...* \n\nUnable to reach the frequency network. Error: ${error.message}\n\nEnsure your API key is configured.`);
  }

  isStreaming = false;
  sendBtn.disabled = !userInput.value.trim();
}

function extractSources(text) {
  const sourcePattern = /\[Source:\s*([^\]]+)\]/gi;
  const matches = [...text.matchAll(sourcePattern)];
  return [...new Set(matches.map(m => m[1].trim()))];
}

function formatContent(text) {
  // Remove source citations from visible text (they'll be shown as tags)
  let formatted = text.replace(/\[Source:\s*[^\]]+\]/gi, '');
  
  // Basic markdown-like formatting
  formatted = formatted.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  formatted = formatted.replace(/\*(.+?)\*/g, '<em>$1</em>');
  formatted = formatted.replace(/`(.+?)`/g, '<code style="background:rgba(139,92,246,0.15);padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>');
  formatted = formatted.replace(/\n\n/g, '</p><p>');
  formatted = formatted.replace(/\n/g, '<br>');
  
  // Wrap in paragraph
  if (!formatted.startsWith('<p>')) formatted = '<p>' + formatted + '</p>';
  
  return formatted;
}

function toggleFavorite(btn) {
  const msgBody = btn.closest('.msg-body');
  const content = msgBody.querySelector('.msg-content').textContent;
  
  // Get the question (previous user message)
  const msgEl = btn.closest('.message');
  const prevMsg = msgEl.previousElementSibling;
  const question = prevMsg?.querySelector('.msg-content')?.textContent || 'Unknown question';

  const existing = favorites.findIndex(f => f.answer === content);
  
  if (existing >= 0) {
    favorites.splice(existing, 1);
    btn.classList.remove('saved');
    btn.innerHTML = '<i class="fas fa-bookmark"></i> Save';
  } else {
    favorites.push({ question, answer: content, date: new Date().toISOString() });
    btn.classList.add('saved');
    btn.innerHTML = '<i class="fas fa-bookmark"></i> Saved';
  }
  
  localStorage.setItem('sd_oracle_favorites', JSON.stringify(favorites));
}

function renderFavorites() {
  if (favorites.length === 0) {
    favoritesList.innerHTML = '<div class="favorites-empty"><i class="fas fa-bookmark" style="font-size:24px;opacity:0.3;margin-bottom:12px;display:block;"></i>No saved answers yet.<br>Click "Save" on any Oracle response to keep it here.</div>';
    return;
  }

  favoritesList.innerHTML = favorites.map((fav, i) => `
    <div class="fav-item">
      <div class="fav-item-q">"${escapeHtml(fav.question.substring(0, 80))}"</div>
      <div class="fav-item-a">${escapeHtml(fav.answer.substring(0, 200))}...</div>
      <div class="fav-item-actions">
        <button class="fav-delete" onclick="deleteFavorite(${i})"><i class="fas fa-trash"></i> Remove</button>
      </div>
    </div>
  `).join('');
}

function deleteFavorite(index) {
  favorites.splice(index, 1);
  localStorage.setItem('sd_oracle_favorites', JSON.stringify(favorites));
  renderFavorites();
}

function closeFavorites() {
  favoritesPanel.classList.remove('open');
  overlay.classList.remove('show');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
