<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The First Octave — the Ancient Builders string the young world as an instrument">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#0b1a2a"/>
      <stop offset="45%" stop-color="#071019"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
    <radialGradient id="world" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#123047"/>
      <stop offset="55%" stop-color="#0c2236"/>
      <stop offset="88%" stop-color="#0a3a4a"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </radialGradient>
    <linearGradient id="string" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- deep space -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant stars -->
  <g fill="#cfe8f7">
    <circle cx="120" cy="90" r="1.4" opacity="0.8"/><circle cx="300" cy="160" r="1" opacity="0.5"/>
    <circle cx="520" cy="70" r="1.6" opacity="0.9"/><circle cx="760" cy="130" r="1" opacity="0.4"/>
    <circle cx="1040" cy="80" r="1.3" opacity="0.7"/><circle cx="1280" cy="150" r="1" opacity="0.5"/>
    <circle cx="1460" cy="90" r="1.7" opacity="0.9"/><circle cx="1380" cy="300" r="1" opacity="0.4"/>
    <circle cx="200" cy="360" r="1.1" opacity="0.5"/><circle cx="90" cy="520" r="1.3" opacity="0.6"/>
    <circle cx="1520" cy="470" r="1.2" opacity="0.6"/><circle cx="700" cy="60" r="1" opacity="0.4"/>
    <circle cx="900" cy="40" r="1.2" opacity="0.6"/><circle cx="1180" cy="360" r="1" opacity="0.4"/>
  </g>

  <!-- the seven wells: light rising off the young world, strung upward -->
  <g stroke="url(#string)" stroke-width="2.2" fill="none" filter="url(#soft)">
    <path d="M560 640 C 540 380, 520 240, 505 70"/>
    <path d="M680 690 C 675 420, 672 250, 668 60"/>
    <path d="M800 705 C 800 430, 800 250, 800 50"/>
    <path d="M920 690 C 925 420, 928 250, 932 60"/>
    <path d="M1040 640 C 1060 380, 1080 240, 1095 70"/>
    <path d="M470 560 C 430 360, 405 250, 388 110"/>
    <path d="M1130 560 C 1170 360, 1195 250, 1212 110"/>
  </g>

  <!-- the young blue world (lower center), being strung -->
  <g>
    <circle cx="800" cy="920" r="430" fill="url(#world)"/>
    <!-- grid meridians suggesting the instrument's strings wrapped on the sphere -->
    <g stroke="#7dd3fc" stroke-opacity="0.18" fill="none" stroke-width="1.4">
      <path d="M470 700 Q 800 640 1130 700"/>
      <path d="M430 780 Q 800 705 1170 780"/>
      <path d="M410 860 Q 800 790 1190 860"/>
      <ellipse cx="800" cy="920" rx="430" ry="150" opacity="0.35"/>
      <ellipse cx="800" cy="920" rx="300" ry="430" opacity="0.25"/>
    </g>
    <!-- seven well-mouths glowing on the surface -->
    <g fill="#fcd34d" filter="url(#glow)">
      <circle cx="560" cy="640" r="5.5"/><circle cx="680" cy="690" r="6"/>
      <circle cx="800" cy="705" r="7"/><circle cx="920" cy="690" r="6"/>
      <circle cx="1040" cy="640" r="5.5"/><circle cx="470" cy="560" r="4.5"/>
      <circle cx="1130" cy="560" r="4.5"/>
    </g>
  </g>

  <!-- the Builder: a vast, faint architect-form at the apex, its hand of light drawing the strings taut -->
  <g opacity="0.9" filter="url(#glow)">
    <circle cx="800" cy="150" r="46" fill="none" stroke="url(#amber)" stroke-width="2"/>
    <circle cx="800" cy="150" r="20" fill="#fcd34d" opacity="0.9"/>
    <!-- radiating tuning lines from the builder to each string top -->
    <g stroke="#fcd34d" stroke-width="1.2" stroke-opacity="0.5">
      <line x1="800" y1="150" x2="505" y2="70"/>
      <line x1="800" y1="150" x2="668" y2="60"/>
      <line x1="800" y1="150" x2="800" y2="50"/>
      <line x1="800" y1="150" x2="932" y2="60"/>
      <line x1="800" y1="150" x2="1095" y2="70"/>
      <line x1="800" y1="150" x2="388" y2="110"/>
      <line x1="800" y1="150" x2="1212" y2="110"/>
    </g>
  </g>

  <!-- faint title strip, lower-left, in-universe -->
  <g opacity="0.55">
    <text x="70" y="836" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#e8e4dc" letter-spacing="1">The First Octave</text>
    <text x="70" y="866" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#7dd3fc" letter-spacing="3">~2.6 BILLION YEARS AGO · THE WORLD WAS BUILT TO SING</text>
  </g>
</svg>
