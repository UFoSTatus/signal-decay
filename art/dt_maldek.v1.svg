<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The Breaking of Maldek — a world forced past its note, shattering into the asteroid belt">
  <defs>
    <radialGradient id="mk-sky" cx="42%" cy="45%" r="90%">
      <stop offset="0%" stop-color="#1a1020"/><stop offset="55%" stop-color="#0c0812"/><stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <radialGradient id="mk-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/><stop offset="30%" stop-color="#fcd34d"/><stop offset="62%" stop-color="#f97316"/><stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <radialGradient id="mk-shard" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6b5a48"/><stop offset="70%" stop-color="#3a3128"/><stop offset="100%" stop-color="#1c1811"/>
    </radialGradient>
    <filter id="mk-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#mk-sky)"/>
  <g fill="#e8d5c0">
    <circle cx="180" cy="120" r="1.3" opacity="0.7"/><circle cx="1360" cy="90" r="1.4" opacity="0.7"/><circle cx="1480" cy="380" r="1" opacity="0.5"/>
    <circle cx="120" cy="640" r="1.2" opacity="0.6"/><circle cx="1420" cy="700" r="1.3" opacity="0.7"/><circle cx="520" cy="60" r="1" opacity="0.4"/>
  </g>

  <!-- shockwave rings from the break -->
  <g transform="translate(720 450)" opacity="0.5">
    <circle r="330" fill="none" stroke="#f97316" stroke-width="2" opacity="0.35"/>
    <circle r="470" fill="none" stroke="#fcd34d" stroke-width="1.5" opacity="0.22"/>
    <circle r="620" fill="none" stroke="#f97316" stroke-width="1" opacity="0.12"/>
  </g>

  <!-- straight-line force grid, cracking (the reachers built in straight lines) -->
  <g transform="translate(720 450)" stroke="#fca5a5" stroke-width="1" opacity="0.25">
    <line x1="-260" y1="-200" x2="260" y2="200"/><line x1="260" y1="-200" x2="-260" y2="200"/>
    <line x1="-300" y1="0" x2="300" y2="0"/><line x1="0" y1="-260" x2="0" y2="260"/>
  </g>

  <!-- the glowing exposed core where the world came untuned -->
  <g transform="translate(720 450)" filter="url(#mk-glow)">
    <circle r="150" fill="url(#mk-core)"/>
  </g>

  <!-- the shattered world: shards flying outward, mid-break -->
  <g transform="translate(720 450)">
    <!-- large near shards still holding a curve of the old surface -->
    <g fill="url(#mk-shard)" stroke="#0c0a07" stroke-width="2">
      <path d="M -220 -120 q 80 -70 190 -40 l 30 90 q -90 60 -180 30 z"/>
      <path d="M 150 -180 q 90 -20 150 40 l -20 90 q -80 30 -150 -20 z"/>
      <path d="M -260 60 q 70 -40 150 -10 l 10 110 q -90 40 -170 -10 z"/>
      <path d="M 120 120 q 100 -20 180 40 l -30 90 q -110 30 -180 -30 z"/>
    </g>
    <!-- flying debris outward (the belt forming) -->
    <g fill="#4a3f30">
      <circle cx="-380" cy="-80" r="12"/><circle cx="-430" cy="40" r="8"/><circle cx="-330" cy="180" r="14"/>
      <circle cx="400" cy="-140" r="10"/><circle cx="470" cy="30" r="13"/><circle cx="380" cy="220" r="9"/>
      <circle cx="-120" cy="-320" r="11"/><circle cx="160" cy="-330" r="8"/><circle cx="40" cy="330" r="12"/>
      <circle cx="-540" cy="-10" r="6"/><circle cx="560" cy="150" r="7"/><circle cx="-200" cy="360" r="7"/>
      <circle cx="300" cy="-300" r="6"/><circle cx="-460" cy="230" r="9"/><circle cx="520" cy="-220" r="6"/>
    </g>
  </g>

  <g opacity="0.6">
    <text x="70" y="812" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#e8e4dc">The Breaking of Maldek</text>
    <text x="70" y="846" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#fca5a5" letter-spacing="2">THEY FORCED THE NOTE THE WORLD COULD NOT HOLD \u00b7 FORCE LEAVES GRAVEL</text>
  </g>
</svg>
