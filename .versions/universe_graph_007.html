// Build lookup maps
const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

// Build connection index
const connections = {}; // nodeId -> [{target, targetCluster}]
nodes.forEach(n => connections[n.id] = []);
links.forEach(l => {
  const src = l.s, tgt = l.t;
  if(nodeMap[src] && nodeMap[tgt]) {
    connections[src].push({ target: tgt, targetCluster: nodeMap[tgt].cluster });
    connections[tgt].push({ target: src, targetCluster: nodeMap[src].cluster });
  }
});

// Count cross-connections per node
function getCrossConnections(nodeId) {
  const node = nodeMap[nodeId];
  if(!node) return [];
  const cross = [];
  const seen = new Set();
  connections[nodeId].forEach(c => {
    if(c.targetCluster !== node.cluster && !seen.has(c.targetCluster)) {
      seen.add(c.targetCluster);
      cross.push(c.targetCluster);
    }
  });
  return cross;
}

// Count nodes per cluster
function getClusterCount(clusterKey) {
  return nodes.filter(n => n.cluster === clusterKey).length;
}

function renderLevel1() {
  const container = document.getElementById('level1');
  const w = container.clientWidth;
  const h = container.clientHeight;
  const cx = w/2, cy = h/2;
  const radius = Math.min(w, h) * 0.34;

  const clusterKeys = Object.keys(CLUSTERS);
  const angleStep = (2 * Math.PI) / clusterKeys.length;

  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;

  // Center hub
  svg += `<circle cx="${cx}" cy="${cy}" r="40" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
  svg += `<text x="${cx}" y="${cy-8}" class="l1-center-title">SIGNAL</text>`;
  svg += `<text x="${cx}" y="${cy+6}" class="l1-center-title">DECAY</text>`;
  svg += `<text x="${cx}" y="${cy+22}" class="l1-center-sub">${nodes.length} nodes • ${links.length} connections</text>`;

  // Category nodes
  clusterKeys.forEach((key, i) => {
    const angle = angleStep * i - Math.PI/2;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    const cluster = CLUSTERS[key];
    const count = getClusterCount(key);

    // Line to center
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="l1-line"/>`;

    // Clickable group
    svg += `<g class="l1-category" onclick="navigateToCluster('${key}')" data-cluster="${key}">`;
    svg += `<circle cx="${x}" cy="${y}" r="28" fill="rgba(0,0,0,0.8)" stroke="${cluster.color}" stroke-width="1.5" class="l1-circle"/>`;
    svg += `<text x="${x}" y="${y-4}" class="l1-label" fill="${cluster.color}" style="font-size:10px">${cluster.name}</text>`;
    svg += `<text x="${x}" y="${y+12}" class="l1-count">${count} nodes</text>`;
    svg += `</g>`;
  });

  svg += `</svg>`;
  container.innerHTML = svg;
}

function renderLevel2(clusterKey, highlightId) {
  const container = document.getElementById('level2');
  const cluster = CLUSTERS[clusterKey];
  const structure = TREE_STRUCTURES[clusterKey];
  if(!structure) return;

  const isTimeline = (clusterKey === 'history');
  const pad = 40;
  const nodeH = 32;
  const groupGap = 50;
  const nodeW = 180;

  // Calculate total rows needed
  let totalRows = 0;
  structure.groups.forEach(g => {
    totalRows += 1; // group label
    totalRows += g.nodes.length;
  });

  const svgH = Math.max(600, totalRows * nodeH + structure.groups.length * groupGap + 120);
  const svgW = Math.max(800, container.clientWidth - 40);

  let svg = `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" class="tree-svg" xmlns="http://www.w3.org/2000/svg">`;

  // Header
  svg += `<text x="${svgW/2}" y="30" text-anchor="middle" fill="${cluster.color}" font-size="16" font-weight="700" letter-spacing="2">${cluster.name.toUpperCase()}</text>`;

  if(isTimeline) {
    // TIMELINE LAYOUT (horizontal)
    svg += renderTimeline(structure, cluster, svgW, svgH, highlightId);
  } else {
    // TREE LAYOUT (vertical groups)
    svg += renderTree(structure, cluster, clusterKey, svgW, svgH, highlightId);
  }

  svg += `</svg>`;
  container.innerHTML = `<div class="tree-container">${svg}</div>`;
}

function renderTree(structure, cluster, clusterKey, svgW, svgH, highlightId) {
  let svg = '';
  const colCount = Math.min(structure.groups.length, 4);
  const colWidth = (svgW - 80) / colCount;
  const startY = 60;

  // Calculate column assignments (try to balance)
  const cols = [];
  for(let i = 0; i < colCount; i++) cols.push([]);
  structure.groups.forEach((g, i) => cols[i % colCount].push(g));

  cols.forEach((col, colIdx) => {
    const baseX = 40 + colIdx * colWidth + colWidth/2;
    let y = startY;

    col.forEach(group => {
      // Group label
      y += 30;
      svg += `<text x="${baseX}" y="${y}" text-anchor="middle" class="tree-group-label">${group.label}</text>`;
      y += 8;

      // Vertical line from label
      const lineStartY = y + 4;

      group.nodes.forEach((nodeId, ni) => {
        y += 30;
        const node = nodeMap[nodeId];
        if(!node) return;

        const isHighlighted = (nodeId === highlightId);
        const crossConns = getCrossConnections(nodeId);
        const hlClass = isHighlighted ? ' highlighted' : '';

        // Connection line
        if(ni > 0 || group.nodes.length > 1) {
          svg += `<line x1="${baseX - 50}" y1="${y}" x2="${baseX - 20}" y2="${y}" class="tree-link"/>`;
        }
        // Vertical connector
        if(ni === 0 && group.nodes.length > 1) {
          svg += `<line x1="${baseX - 50}" y1="${y}" x2="${baseX - 50}" y2="${y + (group.nodes.length-1)*30}" class="tree-link"/>`;
        }

        // Node dot
        const dotR = Math.max(4, node.size * 0.5);
        svg += `<g class="tree-node${hlClass}" onclick="showNodeInfo('${nodeId}')">`;
        svg += `<circle cx="${baseX - 12}" cy="${y}" r="${dotR}" fill="${cluster.color}" opacity="0.8" class="tree-node-dot"/>`;
        svg += `<text x="${baseX}" y="${y + 4}" class="tree-node-label">${escapeHtml(node.name)}</text>`;

        // Cross-connection dots
        crossConns.forEach((cc, ci) => {
          const ccColor = CLUSTERS[cc] ? CLUSTERS[cc].color : '#555';
          svg += `<circle cx="${baseX + getTextWidth(node.name)*6.5 + 12 + ci*12}" cy="${y}" r="3.5" fill="${ccColor}" class="cross-dot" onclick="event.stopPropagation();navigateToCluster('${cc}')"><title>${CLUSTERS[cc]?.name || cc}</title></circle>`;
        });

        svg += `</g>`;
      });

      y += 20;
    });
  });

  return svg;
}

function renderTimeline(structure, cluster, svgW, svgH, highlightId) {
  let svg = '';
  const startY = 70;
  const rowH = 36;
  const centerX = svgW / 2;
  let y = startY;

  // Vertical timeline line
  const totalH = structure.groups.reduce((acc, g) => acc + 40 + g.nodes.length * rowH, 0);
  svg += `<line x1="${centerX}" y1="${startY}" x2="${centerX}" y2="${startY + totalH}" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/>`;

  let nodeIdx = 0;
  structure.groups.forEach((group, gi) => {
    y += 20;
    // Date marker
    svg += `<circle cx="${centerX}" cy="${y}" r="5" fill="${cluster.color}" opacity="0.6"/>`;
    svg += `<text x="${centerX - 60}" y="${y + 4}" text-anchor="end" class="tree-group-label" fill="${cluster.color}">${group.label}</text>`;
    y += 20;

    group.nodes.forEach((nodeId, ni) => {
      const node = nodeMap[nodeId];
      if(!node) return;
      const isHighlighted = (nodeId === highlightId);
      const hlClass = isHighlighted ? ' highlighted' : '';
      const crossConns = getCrossConnections(nodeId);
      const side = (nodeIdx % 2 === 0) ? 1 : -1;
      const nx = centerX + side * 30;

      // Branch line
      svg += `<line x1="${centerX}" y1="${y}" x2="${nx}" y2="${y}" class="tree-link"/>`;

      svg += `<g class="tree-node${hlClass}" onclick="showNodeInfo('${nodeId}')">`;
      svg += `<circle cx="${nx + side*8}" cy="${y}" r="4" fill="${cluster.color}" opacity="0.8" class="tree-node-dot"/>`;
      const textAnchor = side > 0 ? 'start' : 'end';
      svg += `<text x="${nx + side*18}" y="${y + 4}" text-anchor="${textAnchor}" class="tree-node-label">${escapeHtml(node.name)}</text>`;

      // Cross-connection dots
      const dotStart = side > 0 ? nx + side*18 + node.name.length*6.5 + 6 : nx + side*18 - node.name.length*6.5 - 6;
      crossConns.forEach((cc, ci) => {
        const ccColor = CLUSTERS[cc] ? CLUSTERS[cc].color : '#555';
        const dx = side > 0 ? dotStart + ci*12 : dotStart - ci*12;
        svg += `<circle cx="${dx}" cy="${y}" r="3.5" fill="${ccColor}" class="cross-dot" onclick="event.stopPropagation();navigateToCluster('${cc}')"><title>${CLUSTERS[cc]?.name || cc}</title></circle>`;
      });

      svg += `</g>`;
      y += rowH;
      nodeIdx++;
    });
  });

  return svg;
}

function getTextWidth(text) { return text.length; }
function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

      bc += `<span class="sep">›</span><span class="current">${escapeHtml(node.name)}</span>`;
    }
    breadcrumb.innerHTML = bc;
  }
}

// ═══════════════════════════════════════════════════════════════
// INFO PANEL
// ═══════════════════════════════════════════════════════════════

function showNodeInfo(nodeId) {
  const node = nodeMap[nodeId];
  if(!node) return;
  highlightedNode = nodeId;
  updateNav();

  const cluster = CLUSTERS[node.cluster];
  const conns = connections[nodeId] || [];

  // Group connections by cluster
  const grouped = {};
  conns.forEach(c => {
    const tn = nodeMap[c.target];
    if(!tn) return;
    if(!grouped[c.targetCluster]) grouped[c.targetCluster] = [];
    if(!grouped[c.targetCluster].find(x => x.id === c.target)) {
      grouped[c.targetCluster].push(tn);
    }
  });

  let html = `<div class="panel-name" style="color:${cluster.color}">${escapeHtml(node.name)}</div>`;
  html += `<div class="panel-badge" style="background:${cluster.color}22;color:${cluster.color};border:1px solid ${cluster.color}44">${cluster.name}</div>`;

  // Check for UFO dual-view mapping
  if (typeof UFO_MAPPING !== 'undefined' && UFO_MAPPING[nodeId]) {
    const mapping = UFO_MAPPING[nodeId];
    html += `<div style="margin:16px 0 8px;padding:12px;border:1px solid #10b98140;border-radius:8px;background:#10b98108">`;
    html += `<div style="font-size:10px;color:#10b981;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700">\u{1F30D} REAL WORLD</div>`;
    html += `<div style="font-size:12px;color:#bbb;line-height:1.5">${escapeHtml(mapping.real)}</div>`;
    html += `</div>`;
    html += `<div style="margin:8px 0 16px;padding:12px;border:1px solid #f59e0b40;border-radius:8px;background:#f59e0b08">`;
    html += `<div style="font-size:10px;color:#f59e0b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700">\u{1F3B8} SIGNAL DECAY</div>`;
    html += `<div style="font-size:12px;color:#bbb;line-height:1.5">${escapeHtml(mapping.story)}</div>`;
    html += `</div>`;
  } else {
    html += `<div class="panel-desc">${escapeHtml(node.desc)}</div>`;
  }

  html += `<div class="panel-section-title">Connected to (${conns.length})</div>`;

  Object.keys(grouped).forEach(ck => {
    const cl = CLUSTERS[ck];
    html += `<div style="margin-top:8px;font-size:10px;color:${cl.color};letter-spacing:0.5px;opacity:0.7">${cl.name}</div>`;
    grouped[ck].forEach(tn => {
      html += `<div class="panel-conn" onclick="navigateToNode('${tn.id}')">`;
      html += `<span class="panel-conn-dot" style="background:${cl.color}"></span>`;
      html += `${escapeHtml(tn.name)}`;
      html += `</div>`;
    });
  });

  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('info-panel').classList.add('open');
  panelOpen = true;
}

function navigateToNode(nodeId) {
  const node = nodeMap[nodeId];
  if(!node) return;
  const targetCluster = node.cluster;

  if(currentView !== targetCluster) {
    navigateToCluster(targetCluster);
    setTimeout(() => {
      highlightedNode = nodeId;
      renderLevel2(targetCluster, nodeId);
      showNodeInfo(nodeId);
      updateNav();
    }, 100);
  } else {
    highlightedNode = nodeId;
    renderLevel2(targetCluster, nodeId);
    showNodeInfo(nodeId);
    updateNav();
  }
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
  panelOpen = false;
}

// ═══════════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════════

const searchBox = document.getElementById('search-box');
const searchResults = document.getElementById('search-results');

searchBox.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if(q.length < 2) { searchResults.style.display = 'none'; return; }

  const matches = nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12);
  if(matches.length === 0) { searchResults.style.display = 'none'; return; }

  let html = '';
  matches.forEach(n => {
    const cl = CLUSTERS[n.cluster];
    html += `<div class="search-item" onclick="searchSelect('${n.id}')">`;
    html += `<span class="search-dot" style="background:${cl.color}"></span>`;
    html += `<span class="search-name">${escapeHtml(n.name)}</span>`;
    html += `<span class="search-cluster">${cl.name}</span>`;
    html += `</div>`;
  });
  searchResults.innerHTML = html;
  searchResults.style.display = 'block';
});

searchBox.addEventListener('blur', () => {
  setTimeout(() => searchResults.style.display = 'none', 200);
});

function searchSelect(nodeId) {
  searchBox.value = '';
  searchResults.style.display = 'none';
  navigateToNode(nodeId);
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') {
    if(panelOpen) closePanel();
    else if(currentView !== 'overview') goHome();
  }
  if(e.key === '/' && document.activeElement !== searchBox) {
    e.preventDefault();
    searchBox.focus();
  }
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════

function init() {
  renderLevel1();
  updateNav();
  window.addEventListener('resize', () => {
    if(currentView === 'overview') renderLevel1();
    else renderLevel2(currentView, highlightedNode);
  });
}

init();
</script>
</body>
</html>
