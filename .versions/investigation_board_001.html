<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Signal Decay — Investigation Board</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   CSS CUSTOM PROPERTIES & THEMES
   ═══════════════════════════════════════════════════════════════ */
@property --bg-angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

:root {
  --bg-1: #0a0e1a;
  --bg-2: #0d1525;
  --bg-3: #111827;
  --accent-gov: #f59e0b;
  --accent-tech: #22d3ee;
  --accent-event: #ef4444;
  --accent-entity: #10b981;
  --accent-loc: #a855f7;
  --card-bg: rgba(255,255,255,0.06);
  --card-border: rgba(255,255,255,0.1);
  --card-hover: rgba(255,255,255,0.12);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-dim: #475569;
  --string-color: rgba(34,211,238,0.4);
  --string-glow: rgba(34,211,238,0.8);
  --grid-color: rgba(16,185,129,0.04);
  --scanline-opacity: 0.015;
  --grain-opacity: 0.03;
  --particle-color: rgba(34,211,238,0.3);
  --font-mono: 'SF Mono','JetBrains Mono','Cascadia Code','Courier New',monospace;
  --font-ui: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease-out-expo: cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
}

[data-theme="noir"] {
  --bg-1: #000000;
  --bg-2: #0a0a0a;
  --bg-3: #111111;
  --card-bg: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.15);
  --string-color: rgba(255,255,255,0.3);
  --string-glow: rgba(255,255,255,0.7);
  --grid-color: rgba(255,255,255,0.02);
  --particle-color: rgba(255,255,255,0.2);
  --accent-gov: #fbbf24;
  --accent-tech: #e2e8f0;
  --accent-event: #f87171;
  --accent-entity: #6ee7b7;
  --accent-loc: #c4b5fd;
}

[data-theme="military"] {
  --bg-1: #0a1208;
  --bg-2: #0f1a0d;
  --bg-3: #162312;
  --card-bg: rgba(16,185,129,0.05);
  --card-border: rgba(16,185,129,0.15);
  --string-color: rgba(16,185,129,0.4);
  --string-glow: rgba(16,185,129,0.8);
  --grid-color: rgba(16,185,129,0.06);
  --particle-color: rgba(16,185,129,0.3);
  --accent-gov: #fbbf24;
  --accent-tech: #34d399;
  --accent-event: #f87171;
  --accent-entity: #6ee7b7;
  --accent-loc: #a78bfa;
}

/* ═══════════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--bg-1);color:var(--text-primary);
  font-family:var(--font-ui);
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

/* ═══════════════════════════════════════════════════════════════
   ANIMATED BACKGROUND LAYERS
   ═══════════════════════════════════════════════════════════════ */
#bg-layers{position:fixed;inset:0;z-index:0;pointer-events:none}

/* Layer 1: Mesh gradient */
#bg-mesh{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(34,211,238,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 70%, rgba(168,85,247,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 50%, rgba(16,185,129,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 90% 40% at 60% 20%, rgba(245,158,11,0.03) 0%, transparent 50%);
  animation:meshShift 30s ease-in-out infinite alternate;
}
@keyframes meshShift{
  0%{transform:scale(1) rotate(0deg)}
  50%{transform:scale(1.05) rotate(1deg)}
  100%{transform:scale(1) rotate(-1deg)}
}

/* Layer 2: CSS Particles */
#bg-particles{position:absolute;inset:0;overflow:hidden}
.particle{
  position:absolute;
  width:var(--size);height:var(--size);
  background:var(--particle-color);
  border-radius:50%;
  opacity:var(--opacity);
  animation:particleFloat var(--duration) linear infinite;
  animation-delay:var(--delay);
  left:var(--left);
  bottom:-10px;
}
@keyframes particleFloat{
  0%{transform:translateY(0) translateX(0);opacity:var(--opacity)}
  50%{transform:translateY(-50vh) translateX(20px);opacity:calc(var(--opacity)*1.5)}
  100%{transform:translateY(-110vh) translateX(-10px);opacity:0}
}

/* Layer 3: Film grain via SVG turbulence */
#bg-grain{
  position:absolute;inset:0;
  opacity:var(--grain-opacity);
  animation:grainJitter 0.5s steps(8) infinite;
}
@keyframes grainJitter{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-1px,1px)}
  50%{transform:translate(1px,-1px)}
  75%{transform:translate(-1px,-1px)}
}

/* Layer 4: Subtle grid */
#bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--grid-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
  background-size:60px 60px;
}

/* Layer 5: CRT Scanlines */
#bg-scanlines{
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 1px,
    rgba(0,0,0,var(--scanline-opacity)) 1px,
    rgba(0,0,0,var(--scanline-opacity)) 2px
  );
}

/* ═══════════════════════════════════════════════════════════════
   BOARD CONTAINER & CAMERA
   ═══════════════════════════════════════════════════════════════ */
#board-viewport{
  position:fixed;inset:0;z-index:1;
  overflow:hidden;cursor:grab;
}
#board-viewport:active{cursor:grabbing}
#board-canvas{
  position:absolute;
  transform-origin:0 0;
  will-change:transform;
  transition:none;
}
#board-canvas.animating{
  transition:transform 0.6s var(--ease-out-expo);
}

/* ═══════════════════════════════════════════════════════════════
   GLASSMORPHISM CARDS
   ═══════════════════════════════════════════════════════════════ */
.card{
  position:absolute;
  width:280px;
  padding:20px;
  border-radius:16px;
  background:var(--card-bg);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--card-border);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(255,255,255,0.05),
    0 20px 50px -20px rgba(0,0,0,0.6);
  cursor:pointer;
  user-select:none;
  transition:transform 0.3s var(--ease-spring), box-shadow 0.3s ease, border-color 0.3s ease;
  transform:rotate(var(--rotation));
  opacity:0;
  animation:cardEntrance 0.6s var(--ease-out-expo) forwards;
  animation-delay:var(--entrance-delay);
}
@keyframes cardEntrance{
  from{opacity:0;transform:rotate(var(--rotation)) translateY(30px) scale(0.9)}
  to{opacity:1;transform:rotate(var(--rotation)) translateY(0) scale(1)}
}
.card:hover{
  transform:rotate(0deg) scale(1.03) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.2),
    inset 0 -1px 0 rgba(255,255,255,0.08),
    0 30px 60px -20px rgba(0,0,0,0.7);
  z-index:100;
}
.card::before{
  content:'';
  position:absolute;inset:-1px;
  border-radius:17px;
  background:conic-gradient(from var(--bg-angle), transparent 60%, var(--card-accent, var(--accent-tech)) 78%, transparent 95%);
  z-index:-1;
  opacity:0;
  transition:opacity 0.4s ease;
  animation:spinBorder 4s linear infinite;
}
@keyframes spinBorder{
  to{--bg-angle:360deg}
}
.card:hover::before{opacity:1}
.card.explored{border-left:3px solid var(--accent-entity)}
.card.locked{
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(8px);
}
.card.locked .card-body{filter:blur(4px);pointer-events:none}
.card.locked::after{
  content:'[REDACTED]';
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-family:var(--font-mono);
  font-size:14px;
  color:var(--accent-event);
  letter-spacing:4px;
  text-transform:uppercase;
}
.card.fog{
  filter:blur(3px) brightness(0.5);
  pointer-events:none;
}
.card.fog:hover{transform:rotate(var(--rotation)) !important}

.card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-icon{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  color:var(--card-accent);
  flex-shrink:0;
}
.card-icon svg{width:20px;height:20px;filter:url(#icon-glow)}
.card-title{
  font-family:var(--font-mono);
  font-size:13px;
  font-weight:600;
  letter-spacing:-0.3px;
  color:var(--text-primary);
  line-height:1.3;
}
.card-meta{
  font-size:10px;
  color:var(--text-dim);
  font-family:var(--font-mono);
  text-transform:uppercase;
  letter-spacing:1px;
  margin-top:2px;
}
.card-body{
  font-size:12px;
  line-height:1.6;
  color:var(--text-secondary);
  overflow:hidden;
  max-height:60px;
}
.card-level{
  position:absolute;top:8px;right:8px;
  font-family:var(--font-mono);
  font-size:9px;
  padding:2px 6px;
  border-radius:4px;
  background:rgba(255,255,255,0.06);
  color:var(--text-dim);
  letter-spacing:1px;
}

/* ═══════════════════════════════════════════════════════════════
   STRINGS / CONNECTIONS SVG
   ═══════════════════════════════════════════════════════════════ */
#connections-svg{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  overflow:visible;
}
.connection-line{
  fill:none;
  stroke:var(--string-color);
  stroke-width:1.5;
  stroke-dasharray:1000;
  stroke-dashoffset:1000;
  animation:drawLine 1.5s var(--ease-out-expo) forwards;
  animation-delay:var(--line-delay);
}
@keyframes drawLine{to{stroke-dashoffset:0}}
.connection-line.critical{
  stroke:var(--string-glow);
  stroke-width:2.5;
  filter:url(#string-glow);
}
.connection-line.hidden{opacity:0;transition:opacity 0.5s ease}
.connection-label{
  font-family:var(--font-mono);
  font-size:9px;
  fill:var(--text-dim);
  opacity:0;
  transition:opacity 0.3s ease;
}
.connection-label.visible{opacity:1}
.pulse-dot{
  fill:var(--accent-tech);
  opacity:0.8;
}

/* ═══════════════════════════════════════════════════════════════
   UI PANELS
   ═══════════════════════════════════════════════════════════════ */
#ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none}
#ui-layer>*{pointer-events:auto}

/* Top bar */
#top-bar{
  position:absolute;top:0;left:0;right:0;
  padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg, rgba(10,14,26,0.9) 0%, transparent 100%);
}
#top-bar h1{
  font-family:var(--font-mono);
  font-size:14px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--accent-tech);
}
.top-bar-actions{display:flex;gap:8px;align-items:center}
.ui-btn{
  width:36px;height:36px;
  border-radius:10px;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  backdrop-filter:blur(12px);
  color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all 0.2s ease;
  font-size:16px;
}
.ui-btn:hover{background:var(--card-hover);color:var(--text-primary);border-color:rgba(255,255,255,0.2)}
.ui-btn.active{color:var(--accent-tech);border-color:var(--accent-tech)}

/* Progress bar */
#progress-panel{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;
  padding:8px 16px;
  border-radius:12px;
  background:var(--card-bg);
  backdrop-filter:blur(16px);
  border:1px solid var(--card-border);
}
#progress-text{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-secondary);
  white-space:nowrap;
}
#progress-bar{
  width:120px;height:4px;
  border-radius:2px;
  background:rgba(255,255,255,0.08);
  overflow:hidden;
}
#progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent-tech),var(--accent-entity));
  border-radius:2px;
  transition:width 0.5s var(--ease-out-expo);
}

/* Minimap */
#minimap{
  position:absolute;bottom:20px;left:20px;
  width:140px;height:90px;
  border-radius:10px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(8px);
  border:1px solid var(--card-border);
  overflow:hidden;
  opacity:0.4;
  transition:opacity 0.3s ease;
  cursor:pointer;
}
#minimap:hover{opacity:1}
#minimap-canvas{width:100%;height:100%}
#minimap-viewport{
  position:absolute;
  border:1px solid rgba(255,255,255,0.6);
  border-radius:2px;
  pointer-events:none;
}

/* Zoom controls */
#zoom-controls{
  position:absolute;bottom:20px;right:20px;
  display:flex;flex-direction:column;gap:4px;
}
#zoom-controls .ui-btn{
  width:40px;height:40px;font-size:18px;border-radius:10px;
}
#zoom-level{
  font-family:var(--font-mono);
  font-size:10px;
  text-align:center;
  color:var(--text-dim);
  margin-top:4px;
}

/* Back-to-content button */
#back-btn{
  position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  padding:8px 20px;
  border-radius:20px;
  background:var(--accent-tech);
  color:var(--bg-1);
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:1px;
  border:none;cursor:pointer;
  opacity:0;pointer-events:none;
  transition:opacity 0.3s ease, transform 0.3s var(--ease-spring);
}
#back-btn.visible{opacity:1;pointer-events:auto}
#back-btn:hover{transform:translateX(-50%) scale(1.05)}

/* Detail panel */
#detail-panel{
  position:absolute;top:0;right:-420px;bottom:0;width:400px;
  background:rgba(10,14,26,0.95);
  backdrop-filter:blur(30px);
  border-left:1px solid var(--card-border);
  padding:24px;
  overflow-y:auto;
  transition:right 0.4s var(--ease-out-expo);
  z-index:20;
}
#detail-panel.open{right:0}
#detail-close{
  position:absolute;top:16px;right:16px;
  width:32px;height:32px;border-radius:8px;
  background:rgba(255,255,255,0.06);border:none;
  color:var(--text-secondary);cursor:pointer;
  font-size:18px;display:flex;align-items:center;justify-content:center;
}
#detail-title{
  font-family:var(--font-mono);font-size:18px;font-weight:700;
  margin:8px 0 4px;color:var(--text-primary);
}
#detail-meta{
  font-family:var(--font-mono);font-size:10px;
  color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;
}
#detail-body{
  font-size:14px;line-height:1.8;color:var(--text-secondary);
}
#detail-body p{margin-bottom:12px}

/* Timeline */
#timeline-panel{
  position:absolute;bottom:0;left:0;right:0;
  padding:12px 20px 16px;
  background:linear-gradient(0deg, rgba(10,14,26,0.95) 0%, transparent 100%);
  display:none;
}
#timeline-panel.open{display:block}
#timeline-track{
  width:100%;height:4px;border-radius:2px;
  background:rgba(255,255,255,0.08);
  position:relative;cursor:pointer;margin-top:8px;
}
#timeline-fill{height:100%;border-radius:2px;background:var(--accent-tech);width:0%}
#timeline-labels{
  display:flex;justify-content:space-between;
  font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:6px;
}

/* Settings panel */
#settings-panel{
  position:absolute;top:60px;right:20px;
  width:220px;padding:16px;
  border-radius:12px;
  background:rgba(10,14,26,0.95);
  backdrop-filter:blur(20px);
  border:1px solid var(--card-border);
  display:none;
}
#settings-panel.open{display:block}
.settings-group{margin-bottom:12px}
.settings-label{
  font-family:var(--font-mono);font-size:10px;
  color:var(--text-dim);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:6px;
}
.theme-btn{
  display:block;width:100%;
  padding:8px 12px;margin-bottom:4px;
  border-radius:8px;border:1px solid var(--card-border);
  background:transparent;color:var(--text-secondary);
  font-family:var(--font-mono);font-size:11px;
  cursor:pointer;text-align:left;
  transition:all 0.2s ease;
}
.theme-btn:hover,.theme-btn.active{
  background:rgba(255,255,255,0.06);color:var(--text-primary);
  border-color:var(--accent-tech);
}

/* Achievement toast */
.achievement-toast{
  position:fixed;top:80px;right:20px;z-index:1000;
  padding:14px 20px;border-radius:12px;
  background:rgba(16,185,129,0.15);
  backdrop-filter:blur(16px);
  border:1px solid rgba(16,185,129,0.3);
  font-family:var(--font-mono);font-size:12px;
  color:var(--accent-entity);
  animation:toastIn 0.4s var(--ease-spring), toastOut 0.4s ease 3s forwards;
  pointer-events:none;
}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

/* Bootup overlay */
#bootup{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg-1);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
}
#bootup.hidden{
  opacity:0;pointer-events:none;
  transition:opacity 0.8s ease;
}
.boot-line{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--accent-tech);
  opacity:0;
  animation:bootType 0.4s ease forwards;
  letter-spacing:1px;
}
@keyframes bootType{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}
.boot-line.glitch{
  animation:bootType 0.4s ease forwards, glitchText 0.15s ease 0.3s 3;
}
@keyframes glitchText{
  0%{transform:translate(2px,-1px);opacity:0.8}
  50%{transform:translate(-2px,1px);opacity:0.6}
  100%{transform:translate(0);opacity:1}
}

/* Stats panel */
#stats-panel{
  position:absolute;top:70px;left:20px;
  padding:12px 16px;border-radius:10px;
  background:var(--card-bg);
  backdrop-filter:blur(16px);
  border:1px solid var(--card-border);
  font-family:var(--font-mono);font-size:10px;
  color:var(--text-dim);
  display:flex;flex-direction:column;gap:4px;
}
.stat-row{display:flex;justify-content:space-between;gap:20px}
.stat-val{color:var(--text-secondary)}

/* Story mode */
#story-overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  padding:40px;
}
#story-overlay.open{display:flex}
#story-content{
  max-width:600px;text-align:center;
}
#story-text{
  font-size:18px;line-height:1.8;color:var(--text-primary);
  font-family:var(--font-mono);margin-bottom:24px;
}
#story-nav{display:flex;gap:12px;justify-content:center}
.story-btn{
  padding:10px 24px;border-radius:8px;
  background:var(--card-bg);border:1px solid var(--card-border);
  color:var(--text-primary);cursor:pointer;
  font-family:var(--font-mono);font-size:12px;
  transition:all 0.2s ease;
}
.story-btn:hover{background:var(--card-hover);border-color:var(--accent-tech)}
.story-btn.primary{background:var(--accent-tech);color:var(--bg-1);border-color:var(--accent-tech)}

/* Admin panel */
#admin-panel{
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,0.9);
  backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
#admin-panel.open{display:flex}
#admin-form{
  width:100%;max-width:500px;
  padding:24px;border-radius:16px;
  background:var(--card-bg);
  backdrop-filter:blur(20px);
  border:1px solid var(--card-border);
}
#admin-form h3{
  font-family:var(--font-mono);font-size:14px;
  color:var(--text-primary);margin-bottom:16px;
}
.form-group{margin-bottom:12px}
.form-group label{

/* ═══════════════════════════════════════════════════════════════
   CAMERA SYSTEM
   ═══════════════════════════════════════════════════════════════ */
const ZOOM_STEPS = [0.25, 0.5, 0.75, 1.0, 1.5, 2.0];
let camera = { x: 0, y: 0, scale: 1, targetX: 0, targetY: 0, targetScale: 1 };
let isDragging = false, dragStart = {x:0,y:0}, cameraStart = {x:0,y:0};
let velocity = {x:0, y:0}, lastDrag = {x:0,y:0,t:0};
let momentumRAF = null;
const FRICTION = 0.92;
const RUBBER_BAND = 0.3;
const RUBBER_SNAP = 0.08;

function getViewport() {
  return { w: window.innerWidth, h: window.innerHeight };
}

function getBoardBounds() {
  const cards = document.querySelectorAll('.card');
  if (!cards.length) return {x:0,y:0,w:1000,h:800};
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  cards.forEach(c => {
    const x = parseFloat(c.style.left);
    const y = parseFloat(c.style.top);
    const w = c.offsetWidth || 280;
    const h = c.offsetHeight || 160;
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + w);
    maxY = Math.max(maxY, y + h);
  });
  return {x:minX-60, y:minY-60, w:maxX-minX+120, h:maxY-minY+120};
}

function zoomToFit(animate=true) {
  const vp = getViewport();
  const bounds = getBoardBounds();
  const scaleX = (vp.w - 80) / bounds.w;
  const scaleY = (vp.h - 160) / bounds.h;
  let scale = Math.min(scaleX, scaleY, 1.5);
  scale = ZOOM_STEPS.reduce((prev,curr) => Math.abs(curr-scale) < Math.abs(prev-scale) ? curr : prev);
  const cx = bounds.x + bounds.w/2;
  const cy = bounds.y + bounds.h/2;
  camera.targetScale = scale;
  camera.targetX = vp.w/2 - cx * scale;
  camera.targetY = vp.h/2 - cy * scale;
  if (animate) {
    animateCamera();
  } else {
    camera.x = camera.targetX;
    camera.y = camera.targetY;
    camera.scale = camera.targetScale;
    applyCamera();
  }
}

function animateCamera() {
  const canvas = document.getElementById('board-canvas');
  canvas.classList.add('animating');
  camera.x = camera.targetX;
  camera.y = camera.targetY;
  camera.scale = camera.targetScale;
  applyCamera();
  setTimeout(() => canvas.classList.remove('animating'), 700);
  updateZoomDisplay();
  updateMinimap();
  checkBackButton();
}

function applyCamera() {
  const canvas = document.getElementById('board-canvas');
  canvas.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
}

function updateZoomDisplay() {
  document.getElementById('zoom-level').textContent = Math.round(camera.scale * 100) + '%';
}

function zoomIn() {
  const idx = ZOOM_STEPS.indexOf(camera.scale);
  if (idx < ZOOM_STEPS.length - 1) {
    const vp = getViewport();
    const cx = (vp.w/2 - camera.x) / camera.scale;
    const cy = (vp.h/2 - camera.y) / camera.scale;
    camera.targetScale = ZOOM_STEPS[idx + 1];
    camera.targetX = vp.w/2 - cx * camera.targetScale;
    camera.targetY = vp.h/2 - cy * camera.targetScale;
    animateCamera();
  }
}

function zoomOut() {
  const idx = ZOOM_STEPS.indexOf(camera.scale);
  if (idx > 0) {
    const vp = getViewport();
    const cx = (vp.w/2 - camera.x) / camera.scale;
    const cy = (vp.h/2 - camera.y) / camera.scale;
    camera.targetScale = ZOOM_STEPS[idx - 1];
    camera.targetX = vp.w/2 - cx * camera.targetScale;
    camera.targetY = vp.h/2 - cy * camera.targetScale;
    animateCamera();
  }
}

function checkBackButton() {
  const bounds = getBoardBounds();
  const vp = getViewport();
  const boardCenterX = bounds.x + bounds.w/2;
  const boardCenterY = bounds.y + bounds.h/2;
  const screenCX = (vp.w/2 - camera.x) / camera.scale;
  const screenCY = (vp.h/2 - camera.y) / camera.scale;
  const dist = Math.hypot(screenCX - boardCenterX, screenCY - boardCenterY);
  const btn = document.getElementById('back-btn');
  btn.classList.toggle('visible', dist > bounds.w * 0.8);
}

// Mouse/touch handlers
function onPointerDown(e) {
  if (e.target.closest('#ui-layer') || e.target.closest('.card')) return;
  isDragging = true;
  dragStart = {x: e.clientX, y: e.clientY};
  cameraStart = {x: camera.x, y: camera.y};
  velocity = {x:0, y:0};
  lastDrag = {x: e.clientX, y: e.clientY, t: Date.now()};
  if (momentumRAF) cancelAnimationFrame(momentumRAF);
  document.getElementById('board-canvas').classList.remove('animating');
}

function onPointerMove(e) {
  if (!isDragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  camera.x = cameraStart.x + dx;
  camera.y = cameraStart.y + dy;
  applyCamera();
  const now = Date.now();
  const dt = now - lastDrag.t || 16;
  velocity.x = (e.clientX - lastDrag.x) / dt * 16;
  velocity.y = (e.clientY - lastDrag.y) / dt * 16;
  lastDrag = {x: e.clientX, y: e.clientY, t: now};
  updateMinimap();
}

function onPointerUp() {
  if (!isDragging) return;
  isDragging = false;
  if (Math.abs(velocity.x) > 0.5 || Math.abs(velocity.y) > 0.5) {
    startMomentum();
  }
  checkBackButton();
}

function startMomentum() {
  function tick() {
    velocity.x *= FRICTION;
    velocity.y *= FRICTION;
    camera.x += velocity.x;
    camera.y += velocity.y;
    applyCamera();
    updateMinimap();
    if (Math.abs(velocity.x) > 0.1 || Math.abs(velocity.y) > 0.1) {
      momentumRAF = requestAnimationFrame(tick);
    }
  }
  momentumRAF = requestAnimationFrame(tick);
}

// Touch handling for pinch zoom
let touches = [];
let pinchStartDist = 0;
let pinchStartScale = 1;

function onTouchStart(e) {
  if (e.target.closest('#ui-layer')) return;
  touches = Array.from(e.touches);
  if (touches.length === 2) {
    e.preventDefault();
    pinchStartDist = Math.hypot(touches[1].clientX - touches[0].clientX, touches[1].clientY - touches[0].clientY);
    pinchStartScale = camera.scale;
  } else if (touches.length === 1 && !e.target.closest('.card')) {
    isDragging = true;
    dragStart = {x: touches[0].clientX, y: touches[0].clientY};
    cameraStart = {x: camera.x, y: camera.y};
    velocity = {x:0, y:0};
    lastDrag = {x: touches[0].clientX, y: touches[0].clientY, t: Date.now()};
    document.getElementById('board-canvas').classList.remove('animating');
  }
}

function onTouchMove(e) {
  touches = Array.from(e.touches);
  if (touches.length === 2) {
    e.preventDefault();
    const dist = Math.hypot(touches[1].clientX - touches[0].clientX, touches[1].clientY - touches[0].clientY);
    let newScale = pinchStartScale * (dist / pinchStartDist);
    newScale = Math.max(0.25, Math.min(2.0, newScale));
    const closest = ZOOM_STEPS.reduce((prev,curr) => Math.abs(curr-newScale) < Math.abs(prev-newScale) ? curr : prev);
    if (Math.abs(newScale - closest) < 0.08) newScale = closest;
    const midX = (touches[0].clientX + touches[1].clientX) / 2;
    const midY = (touches[0].clientY + touches[1].clientY) / 2;
    const cx = (midX - camera.x) / camera.scale;
    const cy = (midY - camera.y) / camera.scale;
    camera.scale = newScale;
    camera.x = midX - cx * newScale;
    camera.y = midY - cy * newScale;
    applyCamera();
    updateZoomDisplay();
    updateMinimap();
  } else if (touches.length === 1 && isDragging) {
    const dx = touches[0].clientX - dragStart.x;
    const dy = touches[0].clientY - dragStart.y;
    camera.x = cameraStart.x + dx;
    camera.y = cameraStart.y + dy;
    applyCamera();
    const now = Date.now();
    const dt = now - lastDrag.t || 16;
    velocity.x = (touches[0].clientX - lastDrag.x) / dt * 16;
    velocity.y = (touches[0].clientY - lastDrag.y) / dt * 16;
    lastDrag = {x: touches[0].clientX, y: touches[0].clientY, t: now};
    updateMinimap();
  }
}

function onTouchEnd(e) {
  if (e.touches.length === 0 && isDragging) {
    isDragging = false;
    if (Math.abs(velocity.x) > 0.5 || Math.abs(velocity.y) > 0.5) {
      startMomentum();
    }
    checkBackButton();
  }
  touches = Array.from(e.touches);
}

// Wheel zoom
function onWheel(e) {
  e.preventDefault();
  if (e.deltaY < 0) zoomIn();
  else zoomOut();
}

/* ═══════════════════════════════════════════════════════════════
   MINIMAP
   ═══════════════════════════════════════════════════════════════ */
function updateMinimap() {
  const minimapEl = document.getElementById('minimap');
  const canvas = document.getElementById('minimap-canvas');
  const ctx = canvas.getContext('2d');
  const bounds = getBoardBounds();
  const mw = minimapEl.offsetWidth;
  const mh = minimapEl.offsetHeight;
  canvas.width = mw * 2; canvas.height = mh * 2;
  ctx.scale(2, 2);
  ctx.clearRect(0, 0, mw, mh);
  const scale = Math.min(mw / bounds.w, mh / bounds.h) * 0.85;
  const offX = (mw - bounds.w * scale) / 2 - bounds.x * scale;
  const offY = (mh - bounds.h * scale) / 2 - bounds.y * scale;
  
  const colorMap = {government:'#f59e0b',technology:'#22d3ee',events:'#ef4444',entities:'#10b981',locations:'#a855f7'};
  document.querySelectorAll('.card').forEach(c => {
    const x = parseFloat(c.style.left) * scale + offX;
    const y = parseFloat(c.style.top) * scale + offY;
    const entry = ENTRIES.find(e => e.id === c.dataset.id);
    ctx.fillStyle = entry ? (colorMap[entry.category] || '#666') : '#666';
    ctx.globalAlpha = c.classList.contains('fog') ? 0.3 : 0.8;
    ctx.beginPath();
    ctx.arc(x + 4, y + 3, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Viewport indicator
  const vp = getViewport();
  const vpX = (-camera.x / camera.scale) * scale + offX;
  const vpY = (-camera.y / camera.scale) * scale + offY;
  const vpW = (vp.w / camera.scale) * scale;
  const vpH = (vp.h / camera.scale) * scale;
  const mvp = document.getElementById('minimap-viewport');
  mvp.style.left = vpX + 'px';
  mvp.style.top = vpY + 'px';
  mvp.style.width = vpW + 'px';
  mvp.style.height = vpH + 'px';
}

/* ═══════════════════════════════════════════════════════════════
   BOARD LAYOUT & CARD RENDERING
   ═══════════════════════════════════════════════════════════════ */
function generateLayout(entries) {
  const cols = Math.ceil(Math.sqrt(entries.length * 1.5));
  const spacing = {x: 360, y: 260};
  return entries.map((entry, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    return {
      x: col * spacing.x + (row % 2 ? spacing.x * 0.4 : 0) + Math.random() * 40 - 20,
      y: row * spacing.y + Math.random() * 30 - 15
    };
  });
}

function renderBoard() {

  // Clear existing cards (keep SVG defs)
  canvas.querySelectorAll('.card').forEach(c => c.remove());
  
  const state = loadState();
  cardPositions = generateLayout(ENTRIES);
  
  ENTRIES.forEach((entry, i) => {
    const pos = cardPositions[i];
    const rotation = (Math.random() * 4 - 2).toFixed(1);
    const isExplored = state.explored.includes(entry.id);
    const isLocked = entry.locked && !state.unlocked.includes(entry.id);
    const isFog = !isExplored && !isLocked && state.explored.length >= 3;
    
    const card = document.createElement('div');
    card.className = 'card' + (isExplored ? ' explored' : '') + (isLocked ? ' locked' : '') + (isFog ? ' fog' : '');
    card.dataset.id = entry.id;
    card.style.left = pos.x + 'px';
    card.style.top = pos.y + 'px';
    card.style.setProperty('--rotation', rotation + 'deg');
    card.style.setProperty('--entrance-delay', (i * 50 + 800) + 'ms');
    card.style.setProperty('--card-accent', CATEGORY_COLORS[entry.category]);
    
    card.innerHTML = `
      <span class="card-level">LV${entry.level}</span>
      <div class="card-header">
        <div class="card-icon" style="color:${CATEGORY_COLORS[entry.category]}">${ICONS[entry.id] || ''}</div>
        <div>
          <div class="card-title">${entry.title}</div>
          <div class="card-meta">${entry.category} \u00b7 ${entry.year < 0 ? Math.abs(entry.year) + ' BCE' : entry.year}</div>
        </div>
      </div>
      <div class="card-body">${isLocked ? '' : entry.summary}</div>
    `;
    
    card.addEventListener('click', () => onCardClick(entry, card));
    canvas.appendChild(card);
  });
  
  // Render connections
  renderConnections(cardPositions, state);
  
  // Update stats
  updateProgress(state);
  setTimeout(() => updateMinimap(), 1500);
}

function renderConnections(positions, state) {
  const svg = document.getElementById('connections-svg');
  // Remove non-defs elements
  const toRemove = [];
  svg.childNodes.forEach(n => { if (n.tagName && n.tagName !== 'defs') toRemove.push(n); });
  toRemove.forEach(n => n.remove());
  
  const bounds = getBoardBounds();
  svg.style.position = 'absolute';
  svg.style.left = '0px';
  svg.style.top = '0px';
  svg.style.width = (bounds.x + bounds.w + 200) + 'px';
  svg.style.height = (bounds.y + bounds.h + 200) + 'px';
  svg.setAttribute('viewBox', `0 0 ${bounds.x + bounds.w + 200} ${bounds.y + bounds.h + 200}`);
  
  let connCount = 0;
  CONNECTIONS.forEach((conn, i) => {
    const fromIdx = ENTRIES.findIndex(e => e.id === conn.from);
    const toIdx = ENTRIES.findIndex(e => e.id === conn.to);
    if (fromIdx < 0 || toIdx < 0) return;
    
    const fromExplored = state.explored.includes(conn.from);
    const toExplored = state.explored.includes(conn.to);
    const visible = fromExplored || toExplored;
    
    const fp = positions[fromIdx];
    const tp = positions[toIdx];
    const fx = fp.x + 140, fy = fp.y + 80;
    const tx = tp.x + 140, ty = tp.y + 80;
    const midX = (fx + tx) / 2;
    const midY = (fy + ty) / 2 + 30;
    
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${fx},${fy} Q${midX},${midY} ${tx},${ty}`);
    path.setAttribute('class', 'connection-line' + (conn.critical ? ' critical' : '') + (!visible ? ' hidden' : ''));
    path.style.setProperty('--line-delay', (i * 80 + 1500) + 'ms');
    path.id = `conn-${conn.from}-${conn.to}`;
    svg.appendChild(path);
    
    // Label
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('class', 'connection-label');
    text.setAttribute('x', midX);
    text.setAttribute('y', midY - 10);
    text.setAttribute('text-anchor', 'middle');
    text.textContent = conn.label;
    text.dataset.from = conn.from;
    text.dataset.to = conn.to;
    svg.appendChild(text);
    
    if (visible) connCount++;
  });
  
  document.getElementById('stat-conn').textContent = connCount;
}

/* ═══════════════════════════════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════════════════════════════ */
function loadState() {
  try {
    const saved = localStorage.getItem('signalDecay_state');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return { explored: [], unlocked: [], achievements: [], quizScore: 0 };
}

function saveState(state) {
  localStorage.setItem('signalDecay_state', JSON.stringify(state));
}

function onCardClick(entry, cardEl) {
  if (entry.locked && !loadState().unlocked.includes(entry.id)) {
    showToast('\ud83d\udd12 CLASSIFIED \u2014 Explore more nodes to unlock');
    return;
  }
  if (cardEl.classList.contains('fog')) {
    cardEl.classList.remove('fog');
  }
  
  const state = loadState();
  if (!state.explored.includes(entry.id)) {
    state.explored.push(entry.id);
    cardEl.classList.add('explored');
    saveState(state);
    updateProgress(state);
    checkAchievements(state);
    checkUnlocks(state);
    
    // Show connected strings
    CONNECTIONS.forEach(conn => {
      if (conn.from === entry.id || conn.to === entry.id) {
        const path = document.getElementById(`conn-${conn.from}-${conn.to}`);
        if (path) path.classList.remove('hidden');
      }
    });
    updateMinimap();
  }
  
  // Show labels for connected
  document.querySelectorAll('.connection-label').forEach(l => {
    if (l.dataset.from === entry.id || l.dataset.to === entry.id) {
      l.classList.add('visible');
    } else {
      l.classList.remove('visible');
    }
  });
  
  openDetail(entry);
}

function openDetail(entry) {
  const panel = document.getElementById('detail-panel');
  document.getElementById('detail-icon').innerHTML = `<div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,0.05);color:${CATEGORY_COLORS[entry.category]};margin-bottom:8px"><svg style="width:28px;height:28px;filter:url(#icon-glow)">${ICONS[entry.id] ? ICONS[entry.id].replace(/<svg[^>]*>/, '').replace('</svg>','') : ''}</svg></div>`;
  document.getElementById('detail-title').textContent = entry.title;
  document.getElementById('detail-meta').textContent = `${entry.category.toUpperCase()} \u00b7 ${entry.year < 0 ? Math.abs(entry.year) + ' BCE' : entry.year} \u00b7 LEVEL ${entry.level}`;
  document.getElementById('detail-body').innerHTML = entry.article;
  panel.classList.add('open');
}

function updateProgress(state) {
  const explored = state.explored.length;
  const total = ENTRIES.length;
  document.getElementById('progress-text').textContent = `${explored} / ${total} EXPLORED`;
  document.getElementById('progress-fill').style.width = (explored / total * 100) + '%';
}

function checkAchievements(state) {
  const count = state.explored.length;
  const achievements = [
    {id:'first',count:1,msg:'\ud83c\udfc6 FIRST CONTACT \u2014 First node explored'},
    {id:'five',count:5,msg:'\ud83c\udfc6 DEEP COVER \u2014 5 nodes explored'},
    {id:'ten',count:10,msg:'\ud83c\udfc6 INSIDER \u2014 10 nodes explored'},
    {id:'fifteen',count:15,msg:'\ud83c\udfc6 WHISTLEBLOWER \u2014 15 nodes explored'},
    {id:'all',count:18,msg:'\ud83c\udfc6 FULL DISCLOSURE \u2014 All accessible nodes explored'}
  ];
  achievements.forEach(a => {
    if (count >= a.count && !state.achievements.includes(a.id)) {
      state.achievements.push(a.id);
      saveState(state);
      showToast(a.msg);
    }
  });
}

function checkUnlocks(state) {
  if (state.explored.length >= 8 && !state.unlocked.includes('inner_earth')) {
    state.unlocked.push('inner_earth');
    saveState(state);
    showToast('\ud83d\udd13 DECLASSIFIED: Inner Earth Civilizations');
    refreshCard('inner_earth');
  }
  if (state.explored.length >= 12 && !state.unlocked.includes('ancient_builders')) {
    state.unlocked.push('ancient_builders');
    saveState(state);
    showToast('\ud83d\udd13 DECLASSIFIED: Ancient Builder Race');
    refreshCard('ancient_builders');
  }
  if (state.explored.length >= 16 && !state.unlocked.includes('dampener')) {
    state.unlocked.push('dampener');
    saveState(state);
    showToast('\ud83d\udd13 DECLASSIFIED: Frequency Dampener');
    refreshCard('dampener');
  }
}

function refreshCard(id) {
  const card = document.querySelector(`[data-id="${id}"]`);
  if (card) {
    card.classList.remove('locked');
    const entry = ENTRIES.find(e => e.id === id);
    if (entry) {
      card.querySelector('.card-body').textContent = entry.summary;
    }
  }
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'achievement-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

/* ═══════════════════════════════════════════════════════════════
   STORY MODE
   ═══════════════════════════════════════════════════════════════ */
let storyStep = 0;
function openStory() {
  storyStep = 0;
  document.getElementById('story-overlay').classList.add('open');
  showStoryStep();
}
function showStoryStep() {
  const step = STORY_STEPS[storyStep];
  document.getElementById('story-text').textContent = step.text;
  document.getElementById('story-prev').style.display = storyStep > 0 ? 'inline-block' : 'none';
  document.getElementById('story-next').textContent = storyStep < STORY_STEPS.length - 1 ? 'Next \u2192' : 'Finish';
  if (step.focus) {
    const cardIdx = ENTRIES.findIndex(e => e.id === step.focus);
    if (cardIdx >= 0 && cardPositions[cardIdx]) {
      const pos = cardPositions[cardIdx];
      const x = pos.x + 140;
      const y = pos.y + 80;
      const vp = getViewport();
      camera.targetX = vp.w/2 - x * camera.scale;
      camera.targetY = vp.h/2 - y * camera.scale;
      animateCamera();
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   QUIZ
   ═══════════════════════════════════════════════════════════════ */
let quizIdx = 0;
function openQuiz() {
  quizIdx = 0;
  document.getElementById('quiz-overlay').classList.add('open');
  showQuizQuestion();
}
function showQuizQuestion() {
  if (quizIdx >= QUIZ_DATA.length) {
    document.getElementById('quiz-question').textContent = `Quiz complete! You scored ${loadState().quizScore || 0}/${QUIZ_DATA.length}`;
    document.getElementById('quiz-options').innerHTML = '<button class="quiz-option" onclick="closeQuiz()">Close</button>';
    return;
  }
  const q = QUIZ_DATA[quizIdx];
  document.getElementById('quiz-question').textContent = q.q;
  const optsEl = document.getElementById('quiz-options');
  optsEl.innerHTML = q.opts.map((opt, i) => 
    `<button class="quiz-option" data-idx="${i}">${opt}</button>`
  ).join('');
  optsEl.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => answerQuiz(parseInt(btn.dataset.idx)));
  });
}
function answerQuiz(idx) {
  const q = QUIZ_DATA[quizIdx];
  const btns = document.querySelectorAll('#quiz-options .quiz-option');
  btns.forEach((b, i) => {
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx && i !== q.correct) b.classList.add('wrong');
    b.style.pointerEvents = 'none';
  });
  if (idx === q.correct) {
    const state = loadState();
    state.quizScore = (state.quizScore || 0) + 1;
    saveState(state);
  }
  setTimeout(() => { quizIdx++; showQuizQuestion(); }, 1200);
}
function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('open');
}

/* ═══════════════════════════════════════════════════════════════
   ADMIN PANEL
   ═══════════════════════════════════════════════════════════════ */
function openAdmin() { document.getElementById('admin-panel').classList.add('open'); }
function closeAdmin() { document.getElementById('admin-panel').classList.remove('open'); }
function saveEntry() {
  const title = document.getElementById('admin-title').value.trim();
  const category = document.getElementById('admin-category').value;
  const year = parseInt(document.getElementById('admin-year').value) || 2024;
  const summary = document.getElementById('admin-summary').value.trim();
  const article = document.getElementById('admin-article').value.trim();
  if (!title || !summary) { showToast('\u26a0\ufe0f Title and summary required'); return; }
  const id = title.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,20);
  ENTRIES.push({id, title, category, year, level:3, summary, article:`<p>${article}</p>`});
  closeAdmin();
  renderBoard();
  setTimeout(() => zoomToFit(true), 2000);
  showToast('\u2713 Entry added to investigation board');
}

/* ═══════════════════════════════════════════════════════════════
   SETTINGS & THEMES
   ═══════════════════════════════════════════════════════════════ */
function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('open');
}
function setTheme(theme) {
  const themeMap = {frequency:'',noir:'noir',military:'military'};
  document.documentElement.setAttribute('data-theme', themeMap[theme] || '');
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
  localStorage.setItem('signalDecay_theme', theme);
}

/* ═══════════════════════════════════════════════════════════════
   TIMELINE
   ═══════════════════════════════════════════════════════════════ */
function toggleTimeline() {
  document.getElementById('timeline-panel').classList.toggle('open');
  document.getElementById('btn-timeline').classList.toggle('active');
}

/* ═══════════════════════════════════════════════════════════════
   PARTICLES GENERATION
   ═══════════════════════════════════════════════════════════════ */
function generateParticles() {
  const container = document.getElementById('bg-particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.setProperty('--size', (Math.random() * 3 + 1) + 'px');
    p.style.setProperty('--opacity', (Math.random() * 0.5 + 0.1).toFixed(2));
    p.style.setProperty('--duration', (Math.random() * 20 + 15) + 's');
    p.style.setProperty('--delay', (Math.random() * 20) + 's');
    p.style.setProperty('--left', (Math.random() * 100) + '%');
    container.appendChild(p);
  }
}

/* ═══════════════════════════════════════════════════════════════
   BOOTUP SEQUENCE
   ═══════════════════════════════════════════════════════════════ */
function handleBootup() {
  if (sessionStorage.getItem('signalDecay_booted')) {
    document.getElementById('bootup').remove();
    initBoard();
    return;
  }
  sessionStorage.setItem('signalDecay_booted', '1');
  setTimeout(() => {
    document.getElementById('bootup').classList.add('hidden');
    setTimeout(() => {
      document.getElementById('bootup').remove();
      initBoard();
    }, 800);
  }, 3400);
}

/* ═══════════════════════════════════════════════════════════════
   INITIALIZATION
   ═══════════════════════════════════════════════════════════════ */
function initBoard() {
  generateParticles();
  renderBoard();
  
  // Restore theme
  const savedTheme = localStorage.getItem('signalDecay_theme');
  if (savedTheme) setTheme(savedTheme);
  
  // Initial zoom to fit after entrance animations
  setTimeout(() => zoomToFit(true), 2200);
  
  // Event listeners
  const vp = document.getElementById('board-viewport');
  vp.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  vp.addEventListener('touchstart', onTouchStart, {passive:false});
  vp.addEventListener('touchmove', onTouchMove, {passive:false});
  vp.addEventListener('touchend', onTouchEnd);
  vp.addEventListener('wheel', onWheel, {passive:false});
  
  // UI buttons
  document.getElementById('btn-zoom-in').addEventListener('click', zoomIn);
  document.getElementById('btn-zoom-out').addEventListener('click', zoomOut);
  document.getElementById('btn-home').addEventListener('click', () => zoomToFit(true));
  document.getElementById('back-btn').addEventListener('click', () => zoomToFit(true));
  document.getElementById('detail-close').addEventListener('click', () => document.getElementById('detail-panel').classList.remove('open'));
  document.getElementById('btn-settings').addEventListener('click', toggleSettings);
  document.getElementById('btn-timeline').addEventListener('click', toggleTimeline);
  document.getElementById('btn-story').addEventListener('click', openStory);
  document.getElementById('btn-quiz').addEventListener('click', openQuiz);
  document.getElementById('btn-admin').addEventListener('click', openAdmin);
  document.getElementById('admin-save').addEventListener('click', saveEntry);
  document.getElementById('admin-cancel').addEventListener('click', closeAdmin);
  document.getElementById('story-next').addEventListener('click', () => {
    if (storyStep < STORY_STEPS.length - 1) { storyStep++; showStoryStep(); }
    else document.getElementById('story-overlay').classList.remove('open');
  });
  document.getElementById('story-prev').addEventListener('click', () => { if (storyStep > 0) { storyStep--; showStoryStep(); } });
  document.getElementById('story-close').addEventListener('click', () => document.getElementById('story-overlay').classList.remove('open'));
  
  // Theme buttons
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => setTheme(btn.dataset.theme));
  });
  
  // Minimap click
  document.getElementById('minimap').addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const bounds = getBoardBounds();
    const mw = rect.width, mh = rect.height;
    const scale = Math.min(mw / bounds.w, mh / bounds.h) * 0.85;
    const offX = (mw - bounds.w * scale) / 2 - bounds.x * scale;
    const offY = (mh - bounds.h * scale) / 2 - bounds.y * scale;
    const clickX = (e.clientX - rect.left - offX) / scale;
    const clickY = (e.clientY - rect.top - offY) / scale;
    const vpSize = getViewport();
    camera.targetX = vpSize.w/2 - clickX * camera.scale;
    camera.targetY = vpSize.h/2 - clickY * camera.scale;
    animateCamera();
  });
  
  // Resize handler
  window.addEventListener('resize', () => { setTimeout(() => zoomToFit(true), 100); });
  
  // Prevent pull-to-refresh
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
}

// Start
document.addEventListener('DOMContentLoaded', handleBootup);
</script>
</body>
