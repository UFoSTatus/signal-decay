// Build the graph data
const GRAPH_DATA = { nodes, links };

// ═══════════════════════════════════════════════════════════
// FORCE GRAPH INITIALIZATION
// ═══════════════════════════════════════════════════════════

let highlightNodes = new Set();
let highlightLinks = new Set();
let hoverNode = null;
let selectedNode = null;
let activeFilters = new Set(Object.keys(CLUSTERS));

const container = document.getElementById('graph-container');

const Graph = ForceGraph()(container)
  .graphData(GRAPH_DATA)
  .backgroundColor('#000000')
  .nodeId('id')
  .nodeVal(n => n.size * n.size * 0.3)
  .nodeColor(n => {
    if (hoverNode) {
      return highlightNodes.has(n) ? CLUSTERS[n.cluster].color : 'rgba(50,50,50,0.3)';
    }
    return CLUSTERS[n.cluster].color;
  })
  .nodeCanvasObjectMode(() => 'after')
  .nodeCanvasObject((node, ctx, globalScale) => {
    const label = node.name;
    const fontSize = Math.max(10 / globalScale, 2);
    const showLabel = globalScale > 0.8 || node.size >= 10 || highlightNodes.has(node);
    
    if (!showLabel) return;
    
    ctx.font = `${node.size >= 10 ? 'bold ' : ''}${fontSize}px SF Pro Display, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    const alpha = hoverNode && !highlightNodes.has(node) ? 0.15 : 0.9;
    const color = CLUSTERS[node.cluster].color;
    
    // Text shadow for readability
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 3;
    ctx.fillStyle = hoverNode && !highlightNodes.has(node) 
      ? `rgba(100,100,100,${alpha})` 
      : color;
    
    const yOffset = node.size * 0.6 + fontSize * 0.8;
    ctx.fillText(label, node.x, node.y + yOffset);
    ctx.shadowBlur = 0;
  })
  .linkColor(link => {
    if (hoverNode) {
      return highlightLinks.has(link) 
        ? CLUSTERS[nodes.find(n => n.id === link.source.id || n.id === link.source)?.cluster]?.color || '#444'
        : 'rgba(30,30,30,0.2)';
    }
    const sourceNode = typeof link.source === 'object' ? link.source : nodes.find(n => n.id === link.source);
    const color = CLUSTERS[sourceNode?.cluster]?.color || '#333';
    return hexToRgba(color, 0.15);
  })
  .linkWidth(link => {
    if (highlightLinks.has(link)) return link.strength * 1.5;
    return link.strength * 0.4;
  })
  .linkDirectionalParticles(link => highlightLinks.has(link) ? 2 : 0)
  .linkDirectionalParticleWidth(2)
  .linkDirectionalParticleColor(link => {
    const sourceNode = typeof link.source === 'object' ? link.source : nodes.find(n => n.id === link.source);
    return CLUSTERS[sourceNode?.cluster]?.color || '#fff';
  })
  .onNodeHover(node => {
    container.style.cursor = node ? 'pointer' : 'default';
    hoverNode = node;
    highlightNodes.clear();
    highlightLinks.clear();
    
    if (node) {
      highlightNodes.add(node);
      const nodeLinks = GRAPH_DATA.links.filter(l => {
        const sid = typeof l.source === 'object' ? l.source.id : l.source;
        const tid = typeof l.target === 'object' ? l.target.id : l.target;
        return sid === node.id || tid === node.id;
      });
      nodeLinks.forEach(link => {
        highlightLinks.add(link);
        const other = (typeof link.source === 'object' ? link.source.id : link.source) === node.id
          ? (typeof link.target === 'object' ? link.target : nodes.find(n => n.id === link.target))
          : (typeof link.source === 'object' ? link.source : nodes.find(n => n.id === link.source));
        if (other) highlightNodes.add(other);
      });
    }
    Graph.nodeColor(Graph.nodeColor());
    Graph.linkColor(Graph.linkColor());
    Graph.linkWidth(Graph.linkWidth());
  })
  .onNodeClick(node => {
    selectedNode = node;
    showInfoPanel(node);
  })
  .d3AlphaDecay(0.01)
  .d3VelocityDecay(0.3)
  .warmupTicks(100)
  .cooldownTime(5000);

// Custom forces
Graph.d3Force('charge').strength(-80);
Graph.d3Force('link').distance(link => 60 / (link.strength || 1));
Graph.d3Force('center').strength(0.05);

// Cluster force - group nodes by cluster
Graph.d3Force('cluster', (alpha) => {
  const clusterCenters = {};
  const clusterKeys = Object.keys(CLUSTERS);
  const angleStep = (2 * Math.PI) / clusterKeys.length;
  const radius = 200;
  
  clusterKeys.forEach((key, i) => {
    clusterCenters[key] = {
      x: radius * Math.cos(angleStep * i),
      y: radius * Math.sin(angleStep * i)
    };
  });
  
  nodes.forEach(node => {
    if (!node.x || !node.y) return;
    const center = clusterCenters[node.cluster];
    if (!center) return;
    node.vx += (center.x - node.x) * alpha * 0.03;
    node.vy += (center.y - node.y) * alpha * 0.03;
  });
});

// Update stats
document.getElementById('stats').textContent = `${nodes.length} nodes • ${links.length} connections`;

// ═══════════════════════════════════════════════════════════
// INFO PANEL
// ═══════════════════════════════════════════════════════════

function showInfoPanel(node) {
  const panel = document.getElementById('info-panel');
  const content = document.getElementById('panel-content');
  
  // Find connections
  const connections = GRAPH_DATA.links
    .filter(l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return sid === node.id || tid === node.id;
    })
    .map(l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      const otherId = sid === node.id ? tid : sid;
      return nodes.find(n => n.id === otherId);
    })
    .filter(Boolean);
  
  const color = CLUSTERS[node.cluster].color;
  
  content.innerHTML = `
    <div class="node-name" style="color: ${color}">${node.name}</div>
    <div class="node-badge" style="background: ${hexToRgba(color, 0.15)}; color: ${color}; border: 1px solid ${hexToRgba(color, 0.3)}">
      ${CLUSTERS[node.cluster].name}
    </div>
    <div class="node-desc">${node.desc}</div>
    <div class="connections-title">Connected to (${connections.length})</div>
    ${connections.map(c => `
      <div class="connection-item" onclick="zoomToNode('${c.id}')">
        <span class="conn-dot" style="background: ${CLUSTERS[c.cluster].color}"></span>
        ${c.name}
      </div>
    `).join('')}
  `;
  
  panel.classList.add('open');
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
  selectedNode = null;
}

function zoomToNode(nodeId) {
  const node = nodes.find(n => n.id === nodeId);
  if (node) {
    Graph.centerAt(node.x, node.y, 800);
    Graph.zoom(4, 800);
    setTimeout(() => showInfoPanel(node), 850);
  }
}

// ═══════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════

const searchBox = document.getElementById('search-box');
const searchResults = document.getElementById('search-results');

searchBox.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  if (query.length < 2) {
    searchResults.style.display = 'none';
    return;
  }
  
  const matches = nodes
    .filter(n => n.name.toLowerCase().includes(query))
    .slice(0, 10);
  
  if (matches.length === 0) {
    searchResults.style.display = 'none';
    return;
  }
  
  searchResults.innerHTML = matches.map(n => `
    <div class="result-item" onclick="zoomToNode('${n.id}'); searchResults.style.display='none'; searchBox.value='';">
      <span class="dot" style="background: ${CLUSTERS[n.cluster].color}"></span>
      ${n.name}
    </div>
  `).join('');
  searchResults.style.display = 'block';
});

searchBox.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchResults.style.display = 'none';
    searchBox.value = '';
    searchBox.blur();
  }
  if (e.key === 'Enter') {
    const query = searchBox.value.toLowerCase().trim();
    const match = nodes.find(n => n.name.toLowerCase().includes(query));
    if (match) {
      zoomToNode(match.id);
      searchResults.style.display = 'none';
      searchBox.value = '';
    }
  }
});

// Close search results on click outside
document.addEventListener('click', (e) => {
  if (!searchBox.contains(e.target) && !searchResults.contains(e.target)) {
    searchResults.style.display = 'none';
  }
});

// ═══════════════════════════════════════════════════════════
// CLUSTER FILTERS
// ═══════════════════════════════════════════════════════════

const filtersDiv = document.getElementById('filters');

Object.entries(CLUSTERS).forEach(([key, val]) => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn active';
  btn.style.color = val.color;
  btn.innerHTML = `<span class="dot" style="background: ${val.color}"></span>${val.name}`;
  btn.dataset.cluster = key;
  
  btn.addEventListener('click', () => {
    btn.classList.toggle('active');
    if (activeFilters.has(key)) {
      activeFilters.delete(key);
    } else {
      activeFilters.add(key);
    }
    applyFilters();
  });
  
  filtersDiv.appendChild(btn);
});

function applyFilters() {
  const filteredNodes = nodes.filter(n => activeFilters.has(n.cluster));
  const filteredIds = new Set(filteredNodes.map(n => n.id));
  const filteredLinks = links.filter(l => filteredIds.has(l.source.id || l.source) && filteredIds.has(l.target.id || l.target));
  
  Graph.graphData({ nodes: filteredNodes, links: filteredLinks });
}

// ═══════════════════════════════════════════════════════════
// RESET VIEW
// ═══════════════════════════════════════════════════════════

document.getElementById('reset-btn').addEventListener('click', () => {
  Graph.centerAt(0, 0, 1000);
  Graph.zoom(1, 1000);
  closePanel();
  hoverNode = null;
  highlightNodes.clear();
  highlightLinks.clear();
  
  // Reset all filters
  activeFilters = new Set(Object.keys(CLUSTERS));
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.add('active'));
  Graph.graphData(GRAPH_DATA);
});

// ═══════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════

function hexToRgba(hex, alpha) {
  if (!hex) return `rgba(100,100,100,${alpha})`;
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
  if (e.key === '/' && !searchBox.matches(':focus')) {
    e.preventDefault();
    searchBox.focus();
  }
});

// Window resize
window.addEventListener('resize', () => {
  Graph.width(window.innerWidth);
  Graph.height(window.innerHeight);
});
