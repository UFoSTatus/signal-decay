// ═══════════════════════════════════════════════════════════════
// CUSTOM FORCE-DIRECTED GRAPH ENGINE (No External Dependencies)
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;

// Build node map and adjacency
const nodeMap = {};
nodes.forEach(n => {
  n.x = (Math.random() - 0.5) * W * 0.6;
  n.y = (Math.random() - 0.5) * H * 0.6;
  n.vx = 0;
  n.vy = 0;
  nodeMap[n.id] = n;
});

// Resolve links to node references
const resolvedLinks = links.map(l => ({
  source: nodeMap[l.source],
  target: nodeMap[l.target],
  strength: l.strength
})).filter(l => l.source && l.target);

// Build adjacency for quick lookup
const adjacency = {};
nodes.forEach(n => { adjacency[n.id] = []; });
resolvedLinks.forEach(l => {
  adjacency[l.source.id].push(l);
  adjacency[l.target.id].push(l);
});

// View state
let zoom = 1;
let panX = 0;
let panY = 0;
let targetZoom = 1;
let targetPanX = 0;
let targetPanY = 0;
let animatingView = false;

// Interaction state
let hoverNode = null;
let selectedNode = null;
let dragNode = null;
let isDragging = false;
let isPanning = false;
let lastMouse = { x: 0, y: 0 };
let mouseWorld = { x: 0, y: 0 };
let highlightNodes = new Set();
let highlightLinks = new Set();

// Filter state
let activeFilters = new Set(Object.keys(CLUSTERS));
let visibleNodes = [...nodes];
let visibleLinks = [...resolvedLinks];
let visibleNodeSet = new Set(nodes);

// Simulation state
let simAlpha = 1.0;
let simRunning = true;
const SIM_DECAY = 0.0015;
const DAMPING = 0.9;
const REPULSION = 5000;
const REPULSION_MAX_DIST = 250;
const SPRING_STRENGTH = 0.008;
const IDEAL_LENGTH = 80;
const CLUSTER_GRAVITY = 0.0012;
const CENTER_GRAVITY = 0.00015;

// ═══════════════════════════════════════════════════════════════
// FORCE SIMULATION
// ═══════════════════════════════════════════════════════════════

// Spatial hash grid for efficient repulsion
const CELL_SIZE = 60;
let grid = {};

function buildGrid() {
  grid = {};
  for (let i = 0; i < visibleNodes.length; i++) {
    const n = visibleNodes[i];
    const cx = Math.floor(n.x / CELL_SIZE);
    const cy = Math.floor(n.y / CELL_SIZE);
    const key = cx + ',' + cy;
    if (!grid[key]) grid[key] = [];
    grid[key].push(n);
  }
}

function simulate() {
  if (simAlpha <= 0.001 && !dragNode) return;
  
  const alpha = simAlpha;
  
  // Build spatial grid
  buildGrid();
  
  // 1. Repulsion (spatial hash — check neighbors in grid)
  for (let i = 0; i < visibleNodes.length; i++) {
    const a = visibleNodes[i];
    if (a === dragNode) continue;
    const cx = Math.floor(a.x / CELL_SIZE);
    const cy = Math.floor(a.y / CELL_SIZE);
    const searchRadius = Math.ceil(REPULSION_MAX_DIST / CELL_SIZE);
    
    for (let gx = cx - searchRadius; gx <= cx + searchRadius; gx++) {
      for (let gy = cy - searchRadius; gy <= cy + searchRadius; gy++) {
        const cell = grid[gx + ',' + gy];
        if (!cell) continue;
        for (let j = 0; j < cell.length; j++) {
          const b = cell[j];
          if (a === b) continue;
          let dx = a.x - b.x;
          let dy = a.y - b.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 1) { dist = 1; dx = Math.random() - 0.5; dy = Math.random() - 0.5; }
          if (dist > REPULSION_MAX_DIST) continue;
          const force = (REPULSION * alpha) / (dist * dist);
          const fx = (dx / dist) * force;
          const fy = (dy / dist) * force;
          a.vx += fx;
          a.vy += fy;
        }
      }
    }
  }
  
  // 2. Attraction (spring forces along links)
  for (let i = 0; i < visibleLinks.length; i++) {
    const l = visibleLinks[i];
    const s = l.source;
    const t = l.target;
    if (s === dragNode || t === dragNode) continue;
    let dx = t.x - s.x;
    let dy = t.y - s.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) dist = 1;
    const idealDist = IDEAL_LENGTH / (l.strength || 1);
    const displacement = dist - idealDist;
    const force = displacement * SPRING_STRENGTH * alpha * (l.strength || 1);
    const fx = (dx / dist) * force;
    const fy = (dy / dist) * force;
    if (s !== dragNode) { s.vx += fx; s.vy += fy; }
    if (t !== dragNode) { t.vx -= fx; t.vy -= fy; }
  }
  
  // 3. Cluster gravity
  const clusterCenters = {};
  const clusterCounts = {};
  for (let i = 0; i < visibleNodes.length; i++) {
    const n = visibleNodes[i];
    if (!clusterCenters[n.cluster]) { clusterCenters[n.cluster] = { x: 0, y: 0 }; clusterCounts[n.cluster] = 0; }
    clusterCenters[n.cluster].x += n.x;
    clusterCenters[n.cluster].y += n.y;
    clusterCounts[n.cluster]++;
  }
  for (const k in clusterCenters) {
    clusterCenters[k].x /= clusterCounts[k];
    clusterCenters[k].y /= clusterCounts[k];
  }
  
  // Spread cluster centers outward from the global center
  const clusterKeys = Object.keys(CLUSTERS);
  const angleStep = (2 * Math.PI) / clusterKeys.length;
  const targetRadius = 300;
  const clusterTargets = {};
  clusterKeys.forEach((key, i) => {
    clusterTargets[key] = {
      x: targetRadius * Math.cos(angleStep * i),
      y: targetRadius * Math.sin(angleStep * i)
    };
  });
  
  for (let i = 0; i < visibleNodes.length; i++) {
    const n = visibleNodes[i];
    if (n === dragNode) continue;
    const target = clusterTargets[n.cluster];
    if (target) {
      n.vx += (target.x - n.x) * CLUSTER_GRAVITY * alpha;
      n.vy += (target.y - n.y) * CLUSTER_GRAVITY * alpha;
    }
  }
  
  // 4. Centering force
  for (let i = 0; i < visibleNodes.length; i++) {
    const n = visibleNodes[i];
    if (n === dragNode) continue;
    n.vx += (0 - n.x) * CENTER_GRAVITY * alpha;
    n.vy += (0 - n.y) * CENTER_GRAVITY * alpha;
  }
  
  // 5. Apply velocity + damping
  for (let i = 0; i < visibleNodes.length; i++) {
    const n = visibleNodes[i];
    if (n === dragNode) continue;
    n.vx *= DAMPING;
    n.vy *= DAMPING;
    n.x += n.vx;
    n.y += n.vy;
  }
  
  // Decay alpha
  if (!dragNode) {
    simAlpha -= SIM_DECAY;
    if (simAlpha < 0) simAlpha = 0;
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════════

function hexToRgba(hex, alpha) {
  if (!hex) return `rgba(100,100,100,${alpha})`;
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16)
  };
}

function worldToScreen(wx, wy) {
  return {
    x: (wx + panX) * zoom + W / 2,
    y: (wy + panY) * zoom + H / 2
  };
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - W / 2) / zoom - panX,
    y: (sy - H / 2) / zoom - panY
  };
}

function render() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);
  
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(zoom, zoom);
  ctx.translate(panX, panY);
  
  const hasHighlight = hoverNode !== null;
  
  // Draw links
  for (let i = 0; i < visibleLinks.length; i++) {
    const l = visibleLinks[i];
    const s = l.source;
    const t = l.target;
    
    let alpha, width, color;
    if (hasHighlight) {
      if (highlightLinks.has(l)) {
        const c = CLUSTERS[s.cluster].color;
        alpha = 0.6;
        width = l.strength * 1.5 / zoom;
        color = hexToRgba(c, alpha);
      } else {
        alpha = 0.03;
        width = 0.5 / zoom;
        color = `rgba(30,30,30,${alpha})`;
      }
    } else {
      const c = CLUSTERS[s.cluster].color;
      alpha = 0.12;
      width = (l.strength * 0.5) / zoom;
      color = hexToRgba(c, alpha);
    }
    
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(t.x, t.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }
  
  // Draw nodes — TEXT-FIRST design (tiny dots + always-visible names)
  for (let i = 0; i < visibleNodes.length; i++) {
    const n = visibleNodes[i];
    const c = CLUSTERS[n.cluster].color;
    const rgb = hexToRgb(c);
    const r = Math.max(2, n.size * 0.2); // TINY dots
    
    let dim = false;
    if (hasHighlight && !highlightNodes.has(n)) dim = true;
    
    // Tiny colored dot
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = dim ? 'rgba(40,40,40,0.3)' : c;
    ctx.fill();
    
    // Glow ring on hover/selected
    if (!dim && (n === hoverNode || n === selectedNode)) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = c;
      ctx.lineWidth = 1.5 / zoom;
      ctx.stroke();
    }
    
    // Label — ALWAYS visible (text IS the node)
    const fontSize = Math.max(9 / zoom, 3);
    const isImportant = n === hoverNode || n === selectedNode || n.size >= 10;
    ctx.font = isImportant ? 'bold ' + (fontSize * 1.1) + 'px sans-serif' : fontSize + 'px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = dim ? 'rgba(60,60,60,0.3)' : (n === hoverNode ? '#ffffff' : c + 'cc');
    ctx.fillText(n.name, n.x + r + 3, n.y);
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════

function animate() {
  // Smooth view transitions
  if (animatingView) {
    const ease = 0.08;
    panX += (targetPanX - panX) * ease;
    panY += (targetPanY - panY) * ease;
    zoom += (targetZoom - zoom) * ease;
    if (Math.abs(panX - targetPanX) < 0.1 && Math.abs(panY - targetPanY) < 0.1 && Math.abs(zoom - targetZoom) < 0.001) {
      panX = targetPanX;
      panY = targetPanY;
      zoom = targetZoom;
      animatingView = false;
    }
  }
  
  simulate();
  render();
  requestAnimationFrame(animate);
}

// ═══════════════════════════════════════════════════════════════
// INTERACTION — Mouse Events
// ═══════════════════════════════════════════════════════════════

function getNodeAtPoint(wx, wy) {
  // Search in reverse order (topmost first)
  for (let i = visibleNodes.length - 1; i >= 0; i--) {
    const n = visibleNodes[i];
    const radius = (n.size * 0.6 + 2) + 5 / zoom; // Extra hit area
    const dx = n.x - wx;
    const dy = n.y - wy;
    if (dx * dx + dy * dy < radius * radius) return n;
  }
  return null;
}

function updateHighlight(node) {
  highlightNodes.clear();
  highlightLinks.clear();
  hoverNode = node;
  
  if (node) {
    highlightNodes.add(node);
    const nodeLinks = adjacency[node.id] || [];
    nodeLinks.forEach(link => {
      if (!visibleNodeSet.has(link.source) || !visibleNodeSet.has(link.target)) return;
      highlightLinks.add(link);
      const other = link.source === node ? link.target : link.source;
      highlightNodes.add(other);
    });
  }
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  lastMouse = { x: sx, y: sy };
  mouseWorld = screenToWorld(sx, sy);
  
  if (dragNode) {
    dragNode.x = mouseWorld.x;
    dragNode.y = mouseWorld.y;
    dragNode.vx = 0;
    dragNode.vy = 0;
    return;
  }
  
  if (isPanning) {
    const dx = (e.clientX - lastPanMouse.x) / zoom;
    const dy = (e.clientY - lastPanMouse.y) / zoom;
    panX += dx;
    panY += dy;
    targetPanX = panX;
    targetPanY = panY;
    lastPanMouse = { x: e.clientX, y: e.clientY };
    return;
  }
  
  const node = getNodeAtPoint(mouseWorld.x, mouseWorld.y);
  canvas.style.cursor = node ? 'pointer' : 'grab';
  updateHighlight(node);
});

let lastPanMouse = { x: 0, y: 0 };

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const world = screenToWorld(sx, sy);
  
  const node = getNodeAtPoint(world.x, world.y);
  
  if (node) {
    dragNode = node;
    isDragging = true;
    simAlpha = Math.max(simAlpha, 0.3); // Reheat
    canvas.style.cursor = 'grabbing';
  } else {
    isPanning = true;
    lastPanMouse = { x: e.clientX, y: e.clientY };
    canvas.style.cursor = 'grabbing';
    animatingView = false;
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (dragNode && isDragging) {
    // Check if it was a click (minimal movement)
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const world = screenToWorld(sx, sy);
    const node = getNodeAtPoint(world.x, world.y);
    if (node) {
      selectedNode = node;
      showInfoPanel(node);
    }
  }
  dragNode = null;
  isDragging = false;
  isPanning = false;
  canvas.style.cursor = 'default';
});

canvas.addEventListener('mouseleave', () => {
  if (!dragNode) {
    hoverNode = null;
    highlightNodes.clear();
    highlightLinks.clear();
  }
  isPanning = false;
});

// Zoom with mouse wheel
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.max(0.1, Math.min(10, zoom * factor));
  
  // Zoom toward mouse position
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  
  const wx = (mx - W / 2) / zoom - panX;
  const wy = (my - H / 2) / zoom - panY;
  
  zoom = newZoom;
  targetZoom = newZoom;
  
  // Adjust pan to keep point under cursor
  panX = (mx - W / 2) / zoom - wx;
  panY = (my - H / 2) / zoom - wy;
  targetPanX = panX;
  targetPanY = panY;
}, { passive: false });

// Touch support
let touchStartDist = 0;
let touchStartZoom = 1;

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const sx = touch.clientX - rect.left;
    const sy = touch.clientY - rect.top;
    const world = screenToWorld(sx, sy);
    const node = getNodeAtPoint(world.x, world.y);
    if (node) {
      dragNode = node;
      simAlpha = Math.max(simAlpha, 0.3);
    } else {
      isPanning = true;
      lastPanMouse = { x: touch.clientX, y: touch.clientY };
    }
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDist = Math.sqrt(dx * dx + dy * dy);
    touchStartZoom = zoom;
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) {
    const touch = e.touches[0];
    if (dragNode) {
      const rect = canvas.getBoundingClientRect();
      const sx = touch.clientX - rect.left;
      const sy = touch.clientY - rect.top;
      const world = screenToWorld(sx, sy);
      dragNode.x = world.x;
      dragNode.y = world.y;
      dragNode.vx = 0;
      dragNode.vy = 0;
    } else if (isPanning) {
      const dx = (touch.clientX - lastPanMouse.x) / zoom;
      const dy = (touch.clientY - lastPanMouse.y) / zoom;
      panX += dx;
      panY += dy;
      targetPanX = panX;
      targetPanY = panY;
      lastPanMouse = { x: touch.clientX, y: touch.clientY };
    }
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    zoom = Math.max(0.1, Math.min(10, touchStartZoom * (dist / touchStartDist)));
    targetZoom = zoom;
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (dragNode) {
    const rect = canvas.getBoundingClientRect();
    if (e.changedTouches.length > 0) {
      const touch = e.changedTouches[0];
      const sx = touch.clientX - rect.left;
      const sy = touch.clientY - rect.top;
      const world = screenToWorld(sx, sy);
      const node = getNodeAtPoint(world.x, world.y);
      if (node) { selectedNode = node; showInfoPanel(node); }
    }
  }
  dragNode = null;
  isDragging = false;
  isPanning = false;
});

// ═══════════════════════════════════════════════════════════════
// INFO PANEL
// ═══════════════════════════════════════════════════════════════

function showInfoPanel(node) {
  const panel = document.getElementById('info-panel');
  const content = document.getElementById('panel-content');
  
  const connections = [];
  const nodeLinks = adjacency[node.id] || [];
  nodeLinks.forEach(l => {
    const other = l.source === node ? l.target : l.source;
    if (other && visibleNodeSet.has(other)) {
      connections.push(other);
    }
  });
  
  const color = CLUSTERS[node.cluster].color;
  
  content.innerHTML = `
    <div class="node-name" style="color: ${color}">${node.name}</div>
    <div class="node-badge" style="background: ${hexToRgba(color, 0.15)}; color: ${color}; border: 1px solid ${hexToRgba(color, 0.3)}">
      ${CLUSTERS[node.cluster].name}
    </div>
    <div class="node-desc">${node.desc}</div>
    <div class="connections-title">Connected to (${connections.length})</div>
    ${connections.map(c => `
      <div class="connection-item" data-node-id="${c.id}">
        <span class="conn-dot" style="background: ${CLUSTERS[c.cluster].color}"></span>
        ${c.name}
      </div>
    `).join('')}
  `;
  
  // Add click handlers to connection items
  content.querySelectorAll('.connection-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.nodeId;
      zoomToNode(id);
    });
  });
  
  panel.classList.add('open');
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
  selectedNode = null;
}

function zoomToNode(nodeId) {
  const node = nodeMap[nodeId];
  if (!node || !visibleNodeSet.has(node)) return;
  
  targetPanX = -node.x;
  targetPanY = -node.y;
  targetZoom = 3;
  animatingView = true;
  
  setTimeout(() => {
    updateHighlight(node);
    showInfoPanel(node);
  }, 600);
}

// ═══════════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════════

const searchBox = document.getElementById('search-box');
const searchResults = document.getElementById('search-results');

searchBox.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  if (query.length < 2) {
    searchResults.style.display = 'none';
    return;
  }
  
  const matches = nodes
    .filter(n => n.name.toLowerCase().includes(query))
    .slice(0, 10);
  
  if (matches.length === 0) {
    searchResults.style.display = 'none';
    return;
  }
  
  searchResults.innerHTML = matches.map(n => `
    <div class="result-item" data-node-id="${n.id}">
      <span class="dot" style="background: ${CLUSTERS[n.cluster].color}"></span>
      ${n.name}
    </div>
  `).join('');
  
  searchResults.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.nodeId;
      zoomToNode(id);
      searchResults.style.display = 'none';
      searchBox.value = '';
    });
  });
  
  searchResults.style.display = 'block';
});

searchBox.addEventListener('keydown', (e) => {
    const panSpeed = 50;
    if (e.key === 'ArrowUp' || e.key === 'w') { panY += panSpeed; e.preventDefault(); }
    if (e.key === 'ArrowDown' || e.key === 's') { panY -= panSpeed; e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'a') { panX += panSpeed; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd') { panX -= panSpeed; e.preventDefault(); }
    if (e.key === '=' || e.key === '+') { zoom = Math.min(5, zoom * 1.15); e.preventDefault(); }
    if (e.key === '-') { zoom = Math.max(0.2, zoom * 0.87); e.preventDefault(); }
  if (e.key === 'Escape') {
    searchResults.style.display = 'none';
    searchBox.value = '';
    searchBox.blur();
  }
  if (e.key === 'Enter') {
    const query = searchBox.value.toLowerCase().trim();
    const match = nodes.find(n => n.name.toLowerCase().includes(query));
    if (match) {
      zoomToNode(match.id);
      searchResults.style.display = 'none';
      searchBox.value = '';
    }
  }
});

document.addEventListener('click', (e) => {
  if (!searchBox.contains(e.target) && !searchResults.contains(e.target)) {
    searchResults.style.display = 'none';
  }
});

// ═══════════════════════════════════════════════════════════════
// CLUSTER FILTERS
// ═══════════════════════════════════════════════════════════════

const filtersDiv = document.getElementById('filters');

Object.entries(CLUSTERS).forEach(([key, val]) => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn active';
  btn.style.color = val.color;
  btn.innerHTML = `<span class="dot" style="background: ${val.color}"></span>${val.name}`;
  btn.dataset.cluster = key;
  
  btn.addEventListener('click', () => {
    btn.classList.toggle('active');
    if (activeFilters.has(key)) {
      activeFilters.delete(key);
    } else {
      activeFilters.add(key);
    }
    applyFilters();
  });
  
  filtersDiv.appendChild(btn);
});

function applyFilters() {
  visibleNodes = nodes.filter(n => activeFilters.has(n.cluster));
  visibleNodeSet = new Set(visibleNodes);
  visibleLinks = resolvedLinks.filter(l => visibleNodeSet.has(l.source) && visibleNodeSet.has(l.target));
  simAlpha = 0.5; // Reheat on filter change
}

// ═══════════════════════════════════════════════════════════════
// RESET VIEW
// ═══════════════════════════════════════════════════════════════

document.getElementById('reset-btn').addEventListener('click', () => {
  targetPanX = 0;
  targetPanY = 0;
  targetZoom = 1;
  animatingView = true;
  closePanel();
  hoverNode = null;
  highlightNodes.clear();
  highlightLinks.clear();
  
  // Reset all filters
  activeFilters = new Set(Object.keys(CLUSTERS));
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.add('active'));
  applyFilters();
});

// ═══════════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════════

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
  if (e.key === '/' && !searchBox.matches(':focus')) {
    e.preventDefault();
    searchBox.focus();
  }
});

// ═══════════════════════════════════════════════════════════════
// WINDOW RESIZE
// ═══════════════════════════════════════════════════════════════

window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
});

// ═══════════════════════════════════════════════════════════════
// INITIALIZE
// ═══════════════════════════════════════════════════════════════

document.getElementById('stats').textContent = `${nodes.length} nodes • ${links.length} connections`;

// Start animation
animate();
</script>
</body>
</html>
