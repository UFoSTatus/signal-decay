  { source: 'vought', target: 'suppress_proto', strength: 2 },
  { source: 'risk', target: 'convergence_hunters', strength: 1 },
  { source: 'dance', target: 'oren', strength: 1 },
  { source: 'midnight', target: 'resonants', strength: 1 },
  { source: 'loc_bermuda', target: 'usos', strength: 1 },
  { source: 'loc_inner7', target: 'third_octave', strength: 1 },
  { source: 'loc_agarthan', target: 'ancient_builders', strength: 1 }
]

// Build lookup maps
const nodeMap = {};
nodes.forEach((n, i) => { n.x = Math.random() * 800 - 400; n.y = Math.random() * 600 - 300; n.vx = 0; n.vy = 0; n.idx = i; nodeMap[n.id] = n; });

// Process links to reference node objects
const processedLinks = links.map(l => ({
  source: nodeMap[l.source],
  target: nodeMap[l.target],
  strength: l.strength || 1
})).filter(l => l.source && l.target);

// Canvas setup
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// View transform
let scale = 1, offsetX = 0, offsetY = 0;
let dragging = false, dragNode = null, lastMouse = {x:0, y:0};
let hoverNode = null, selectedNode = null;

// Stats
document.getElementById('stats').textContent = nodes.length + ' nodes \u2022 ' + processedLinks.length + ' connections';

// Filters
const filterDiv = document.getElementById('filters');
const activeFilters = new Set(Object.keys(CLUSTERS));
Object.entries(CLUSTERS).forEach(([key, val]) => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn active';
  btn.style.setProperty('--c', val.color);
  btn.style.borderColor = val.color + '60';
  btn.style.color = val.color;
  btn.textContent = val.name;
  btn.onclick = () => {
    if (activeFilters.has(key)) { activeFilters.delete(key); btn.classList.remove('active'); btn.style.color = '#444'; btn.style.borderColor = '#333'; }
    else { activeFilters.add(key); btn.classList.add('active'); btn.style.color = val.color; btn.style.borderColor = val.color + '60'; }
  };
  filterDiv.appendChild(btn);
});

// Force simulation
function simulate() {
  const alpha = 0.3;
  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    if (!activeFilters.has(nodes[i].cluster)) continue;
    for (let j = i + 1; j < nodes.length; j++) {
      if (!activeFilters.has(nodes[j].cluster)) continue;
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      if (dist > 300) continue;
      const force = 120 / (dist * dist) * alpha;
      const fx = dx / dist * force;
      const fy = dy / dist * force;
      nodes[i].vx -= fx; nodes[i].vy -= fy;
      nodes[j].vx += fx; nodes[j].vy += fy;
    }
  }
  // Attraction along links
  processedLinks.forEach(l => {
    if (!activeFilters.has(l.source.cluster) || !activeFilters.has(l.target.cluster)) return;
    const dx = l.target.x - l.source.x;
    const dy = l.target.y - l.source.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const force = (dist - 80) * 0.003 * alpha * l.strength;
    const fx = dx / dist * force;
    const fy = dy / dist * force;
    l.source.vx += fx; l.source.vy += fy;
    l.target.vx -= fx; l.target.vy -= fy;
  });
  // Cluster gravity
  const clusterCenters = {};
  const clusterCounts = {};
  nodes.forEach(n => {
    if (!activeFilters.has(n.cluster)) return;
    if (!clusterCenters[n.cluster]) { clusterCenters[n.cluster] = {x:0,y:0}; clusterCounts[n.cluster] = 0; }
    clusterCenters[n.cluster].x += n.x;
    clusterCenters[n.cluster].y += n.y;
    clusterCounts[n.cluster]++;
  });
  Object.keys(clusterCenters).forEach(c => { clusterCenters[c].x /= clusterCounts[c]; clusterCenters[c].y /= clusterCounts[c]; });
  nodes.forEach(n => {
    if (!activeFilters.has(n.cluster) || !clusterCenters[n.cluster]) return;
    n.vx += (clusterCenters[n.cluster].x - n.x) * 0.0005;
    n.vy += (clusterCenters[n.cluster].y - n.y) * 0.0005;
  });
  // Center gravity
  nodes.forEach(n => { n.vx -= n.x * 0.0001; n.vy -= n.y * 0.0001; });
  // Apply velocity + damping
  nodes.forEach(n => {
    if (n === dragNode) return;
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += n.vx; n.y += n.vy;
  });
}

// Get connected nodes for highlight
function getConnected(node) {
  const set = new Set();
  set.add(node);
  processedLinks.forEach(l => {
    if (l.source === node) set.add(l.target);
    if (l.target === node) set.add(l.source);
  });
  return set;
}

// Render
function render() {
  simulate();
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2 + offsetX, H/2 + offsetY);
  ctx.scale(scale, scale);

  const highlight = hoverNode ? getConnected(hoverNode) : null;

  // Draw links
  processedLinks.forEach(l => {
    if (!activeFilters.has(l.source.cluster) || !activeFilters.has(l.target.cluster)) return;
    const dim = highlight && (!highlight.has(l.source) || !highlight.has(l.target));
    ctx.beginPath();
    ctx.moveTo(l.source.x, l.source.y);
    ctx.lineTo(l.target.x, l.target.y);
    ctx.strokeStyle = dim ? 'rgba(50,50,50,0.1)' : (CLUSTERS[l.source.cluster].color + '30');
    ctx.lineWidth = dim ? 0.3 : (l.strength > 2 ? 1.5 : 0.7);
    ctx.stroke();
  });

  // Draw nodes
  nodes.forEach(n => {
    if (!activeFilters.has(n.cluster)) return;
    const dim = highlight && !highlight.has(n);
    const color = CLUSTERS[n.cluster].color;
    const r = (n.size || 4) * 0.6;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = dim ? 'rgba(40,40,40,0.4)' : color;
    ctx.fill();
    if (!dim && (n === hoverNode || n === selectedNode)) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    // Labels
    if (scale > 0.8 && !dim && (n.size > 6 || scale > 1.5 || n === hoverNode)) {
      ctx.font = (10 / scale) + 'px sans-serif';
      ctx.fillStyle = dim ? '#333' : '#ccc';
      ctx.textAlign = 'center';
      ctx.fillText(n.name, n.x, n.y + r + 10/scale);
    }
  });

  ctx.restore();
  requestAnimationFrame(render);
}
render();

// Mouse interactions
function screenToWorld(sx, sy) { return { x: (sx - W/2 - offsetX) / scale, y: (sy - H/2 - offsetY) / scale }; }
function findNodeAt(wx, wy) {
  for (let i = nodes.length-1; i >= 0; i--) {
    const n = nodes[i];
    if (!activeFilters.has(n.cluster)) continue;
    const dx = n.x - wx, dy = n.y - wy;
    if (dx*dx + dy*dy < ((n.size||4)*0.6 + 5) * ((n.size||4)*0.6 + 5)) return n;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const w = screenToWorld(e.clientX, e.clientY);
  const node = findNodeAt(w.x, w.y);
  if (node) { dragNode = node; } else { dragging = true; }
  lastMouse = {x: e.clientX, y: e.clientY};
});
canvas.addEventListener('mousemove', e => {
  const w = screenToWorld(e.clientX, e.clientY);
  if (dragNode) { dragNode.x = w.x; dragNode.y = w.y; dragNode.vx = 0; dragNode.vy = 0; }
  else if (dragging) { offsetX += e.clientX - lastMouse.x; offsetY += e.clientY - lastMouse.y; }
  else { hoverNode = findNodeAt(w.x, w.y); canvas.style.cursor = hoverNode ? 'pointer' : 'grab'; }
  lastMouse = {x: e.clientX, y: e.clientY};
});
canvas.addEventListener('mouseup', e => {
  if (dragNode && !dragging) {
    const w = screenToWorld(e.clientX, e.clientY);
    const node = findNodeAt(w.x, w.y);
    if (node) openPanel(node);
  }
  dragNode = null; dragging = false;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  scale *= factor;
  scale = Math.max(0.2, Math.min(5, scale));
}, {passive: false});

// Touch support
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const w = screenToWorld(t.clientX, t.clientY);
    const node = findNodeAt(w.x, w.y);
    if (node) { dragNode = node; } else { dragging = true; }
    lastMouse = {x: t.clientX, y: t.clientY};
  }
  e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const w = screenToWorld(t.clientX, t.clientY);
    if (dragNode) { dragNode.x = w.x; dragNode.y = w.y; dragNode.vx = 0; dragNode.vy = 0; }
    else if (dragging) { offsetX += t.clientX - lastMouse.x; offsetY += t.clientY - lastMouse.y; }
    lastMouse = {x: t.clientX, y: t.clientY};
  }
  e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchend', e => { dragNode = null; dragging = false; });

// Panel
function openPanel(node) {
  selectedNode = node;
  const color = CLUSTERS[node.cluster].color;
  document.getElementById('panel-name').textContent = node.name;
  document.getElementById('panel-name').style.color = color;
  document.getElementById('panel-badge').textContent = CLUSTERS[node.cluster].name;
  document.getElementById('panel-badge').style.color = color;
  document.getElementById('panel-badge').style.borderColor = color;
  document.getElementById('panel-desc').textContent = node.desc || 'No description available.';
  // Connections
  const conns = [];
  processedLinks.forEach(l => {
    if (l.source === node) conns.push(l.target);
    if (l.target === node) conns.push(l.source);
  });
  const connDiv = document.getElementById('panel-connections');
  connDiv.innerHTML = conns.map(c => '<div class="conn-item" data-id="' + c.id + '">' + c.name + '</div>').join('');
  connDiv.querySelectorAll('.conn-item').forEach(el => { el.addEventListener('click', function() { zoomToNode(this.dataset.id); }); });
  document.getElementById('panel').classList.add('open');
}
function closePanel() { document.getElementById('panel').classList.remove('open'); selectedNode = null; }
function zoomToNode(id) {
  const n = nodeMap[id];
  if (!n) return;
  offsetX = -n.x * scale;
  offsetY = -n.y * scale;
  hoverNode = n;
  openPanel(n);
}

// Search
const searchBox = document.getElementById('search-box');
searchBox.addEventListener('input', () => {
  const q = searchBox.value.toLowerCase();
  if (q.length < 2) { hoverNode = null; return; }
  const match = nodes.find(n => n.name.toLowerCase().includes(q));
  if (match) { hoverNode = match; zoomToNode(match.id); }
});
document.addEventListener('keydown', e => { if (e.key === '/') { e.preventDefault(); searchBox.focus(); } if (e.key === 'Escape') closePanel(); });

// Reset
function resetView() { scale = 1; offsetX = 0; offsetY = 0; hoverNode = null; closePanel(); }
</script>
</body>
</html>
